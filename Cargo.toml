[package]
name = "raycast2api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Signature computation (X-Raycast-Signature-v2).
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
# Image attachments: inbound data-URL decoding; ai/files upload checksum (md5-base64).
base64 = "0.22.1"
md-5 = "0.10.6"

# Async HTTP gateway stack.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "process", "io-util"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Async client to the Raycast backend. rustls avoids a system OpenSSL dependency;
# `stream` enables reading the SSE response body incrementally;
# `socks` adds socks5 proxy support for the fallback proxy chain.
# http2:chat 管道需 h2 协商(对齐真实客户端 undici fetch);移除会静默降级
# chat 为 HTTP/1.1。gzip/brotli/deflate/zstd:响应自动解压(显式 accept-encoding 时不覆盖)。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "gzip", "brotli", "deflate", "zstd", "http2"] }
futures-util = "0.3"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager"] }
# Ergonomic async generators for building the SSE translation stream.
async-stream = "0.3"

# Serialization for the OpenAI-compatible contract and Raycast wire types.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
time = { version = "0.3", features = ["formatting"] }

# OS CSPRNG for managed API-key generation and id randomness (already a
# transitive dep). The hand-rolled /dev/urandom reader fails on Windows.
getrandom = "0.2"

# Embeds src/page/ (the management console) into the binary: files are baked in
# for release builds and read from disk in debug builds, so adding a console
# file needs no Rust change. `mime-guess` supplies Content-Type, `include-exclude`
# keeps stray files such as .DS_Store out of the binary.
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }

# Shared SQLite storage for the account store (and future modules).
diesel = { version = "2.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

[dev-dependencies]
# Used by contract tests to drive the router in-process (`oneshot`).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
