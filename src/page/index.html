<!doctype html>
<html lang="zh-CN" class="h-full w-full overflow-hidden">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>Raycast 管理控制台</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <style type="text/tailwindcss">
            @theme {
                --color-brand: #262b33;
                --color-ink: #242933;
                --color-muted: #667080;
                --color-line: #e4e7ec;
            }
        </style>
    </head>
    <body
        class="m-0 h-full w-full overflow-hidden bg-[#f7f8fa] font-sans text-ink [&_button]:cursor-pointer [&_select]:cursor-pointer [&_button]:transition-colors [&_button]:duration-150 [&_button:disabled]:cursor-not-allowed [&_button:focus-visible]:outline-3 [&_input:focus-visible]:outline-3 [&_select:focus-visible]:outline-3 [&_textarea:focus-visible]:outline-3 [&_:focus-visible]:outline-offset-3 [&_:focus-visible]:outline-blue-500/35 motion-reduce:[&_*]:animate-none motion-reduce:[&_*]:transition-none"
    >
        <account-console class="block h-dvh overflow-hidden"></account-console>
        <script type="module">
            import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
            import { repeat } from 'https://cdn.jsdelivr.net/npm/lit-html@3.3.1/directives/repeat.js';
            const motionEnabled = () => window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches;
            class UiTooltip extends LitElement {
                static properties = { content: { type: String } };
                static styles = css`
                    :host {
                        display: block;
                        min-width: 0;
                    }
                    .trigger {
                        display: block;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        outline-offset: 3px;
                    }
                    .trigger:focus-visible {
                        outline: 2px solid #3b82f6;
                    }
                    .tip {
                        position: fixed;
                        inset: auto;
                        margin: 0;
                        box-sizing: border-box;
                        width: max-content;
                        max-width: min(420px, calc(100vw - 24px));
                        max-height: min(360px, calc(100dvh - 24px));
                        overflow: auto;
                        border: 0;
                        border-radius: 8px;
                        padding: 9px 12px;
                        background: #242933;
                        color: white;
                        font:
                            12px/1.6 system-ui,
                            sans-serif;
                        white-space: pre-wrap;
                        overflow-wrap: anywhere;
                        box-shadow: 0 6px 24px #10182826;
                    }
                `;
                async show() {
                    clearTimeout(this.hideTimer);
                    if (!this.content) return;
                    await this.updateComplete;
                    const tip = this.shadowRoot.querySelector('.tip');
                    if (!tip.isConnected) return;
                    const opening = !tip.matches(':popover-open');
                    window.gsap?.killTweensOf(tip);
                    if (opening) tip.showPopover();
                    if (window.gsap) window.gsap.set(tip, { y: 0 });
                    const anchor = this.getBoundingClientRect();
                    const bounds = tip.getBoundingClientRect();
                    tip.style.left = Math.max(12, Math.min(anchor.left, innerWidth - bounds.width - 12)) + 'px';
                    tip.style.top =
                        Math.max(
                            12,
                            anchor.bottom + bounds.height + 8 <= innerHeight - 12 ? anchor.bottom + 8 : anchor.top - bounds.height - 8
                        ) + 'px';
                    if (motionEnabled()) {
                        if (opening) window.gsap.set(tip, { opacity: 0, y: 4 });
                        window.gsap.to(tip, { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out', overwrite: true });
                    } else if (window.gsap) window.gsap.set(tip, { opacity: 1, y: 0 });
                }
                hide() {
                    clearTimeout(this.hideTimer);
                    const tip = this.shadowRoot?.querySelector('.tip');
                    if (!tip?.matches(':popover-open')) return;
                    window.gsap?.killTweensOf(tip);
                    if (this.isConnected && motionEnabled())
                        window.gsap.to(tip, { opacity: 0, y: 4, duration: 0.12, ease: 'power1.out', onComplete: () => tip.hidePopover() });
                    else tip.hidePopover();
                }
                scheduleHide() {
                    this.hideTimer = setTimeout(() => this.hide(), 120);
                }
                disconnectedCallback() {
                    this.hide();
                    super.disconnectedCallback();
                }
                render() {
                    return html`<span
                            class="trigger"
                            tabindex="0"
                            aria-describedby="tooltip"
                            @mouseenter=${this.show}
                            @mouseleave=${this.scheduleHide}
                            @focus=${this.show}
                            @blur=${this.scheduleHide}
                            @keydown=${e => {
                                if (e.key === 'Escape') this.hide();
                            }}
                            ><slot>${this.content}</slot></span
                        >
                        <div
                            id="tooltip"
                            class="tip"
                            role="tooltip"
                            popover="manual"
                            @mouseenter=${() => clearTimeout(this.hideTimer)}
                            @mouseleave=${this.scheduleHide}
                            @keydown=${e => {
                                if (e.key === 'Escape') this.hide();
                            }}
                        >
                            ${this.content}
                        </div>`;
                }
            }
            customElements.define('ui-tooltip', UiTooltip);
            class UiMessage extends LitElement {
                static properties = { items: { state: true } };
                static styles = css`
                    :host {
                        position: fixed;
                        inset: 20px 20px auto auto;
                        margin: 0;
                        padding: 0;
                        border: 0;
                        width: min(440px, calc(100vw - 32px));
                        overflow: visible;
                        background: transparent;
                        color: #242933;
                        font:
                            13px/20px system-ui,
                            sans-serif;
                    }
                    .message {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        margin-bottom: 10px;
                        padding: 10px 12px;
                        border: 1px solid #e4e7ec;
                        border-radius: 10px;
                        background: white;
                        box-shadow: 0 6px 24px #1018281a;
                    }
                    .icon {
                        flex: none;
                        display: grid;
                        place-items: center;
                        width: 18px;
                        height: 18px;
                        border-radius: 50%;
                        font-size: 12px;
                        font-weight: 600;
                        background: #fef2f2;
                        color: #b91c1c;
                    }
                    .success .icon {
                        background: #ecfdf5;
                        color: #047857;
                    }
                    ui-tooltip {
                        flex: 1;
                        min-width: 0;
                    }
                    button {
                        flex: none;
                        width: 28px;
                        height: 28px;
                        border: 0;
                        border-radius: 5px;
                        background: transparent;
                        color: #667080;
                        font: inherit;
                        font-size: 18px;
                        cursor: pointer;
                    }
                    button:hover {
                        background: #f1f5f9;
                    }
                    button:focus-visible {
                        outline: 2px solid #3b82f6;
                    }
                `;
                constructor() {
                    super();
                    this.items = [];
                    this.timers = new Map();
                    this.nextId = 0;
                }
                connectedCallback() {
                    super.connectedCallback();
                    this.setAttribute('popover', 'manual');
                }
                show(text, type = 'error') {
                    const item = { id: ++this.nextId, text: String(text), type };
                    this.items = [...this.items, item];
                    this.resume(item);
                }
                pause(item) {
                    clearTimeout(this.timers.get(item.id));
                }
                resume(item) {
                    this.pause(item);
                    if (!item.closing)
                        this.timers.set(
                            item.id,
                            setTimeout(() => this.close(item.id), item.type === 'error' ? 8000 : 4000)
                        );
                }
                close(id) {
                    const item = this.items.find(item => item.id === id);
                    if (!item || item.closing) return;
                    item.closing = true;
                    this.pause(item);
                    this.timers.delete(id);
                    const node = this.shadowRoot.querySelector('[data-id="' + id + '"]');
                    const remove = () => {
                        const positions = new Map(
                            [...this.shadowRoot.querySelectorAll('.message')].map(element => [element, element.getBoundingClientRect().top])
                        );
                        this.items = this.items.filter(item => item.id !== id);
                        this.updateComplete.then(() => {
                            if (!this.isConnected || !motionEnabled()) return;
                            for (const element of this.shadowRoot.querySelectorAll('.message')) {
                                const y = positions.get(element) - element.getBoundingClientRect().top;
                                if (y && !this.items.find(item => item.id === Number(element.dataset.id))?.closing)
                                    window.gsap.fromTo(element, { y }, { y: 0, duration: 0.2, ease: 'power2.out', overwrite: 'auto' });
                            }
                        });
                    };
                    if (node && motionEnabled())
                        window.gsap.to(node, {
                            opacity: 0,
                            x: 20,
                            duration: 0.18,
                            ease: 'power1.out',
                            overwrite: true,
                            onComplete: remove
                        });
                    else remove();
                }
                updated() {
                    if (this.items.length) {
                        if (this.matches(':popover-open')) this.hidePopover();
                        this.showPopover();
                    } else if (!this.items.length && this.matches(':popover-open')) this.hidePopover();
                    for (const node of this.shadowRoot.querySelectorAll('.message')) {
                        if (node.dataset.entered) continue;
                        node.dataset.entered = 'true';
                        if (motionEnabled())
                            window.gsap.fromTo(
                                node,
                                { opacity: 0, x: 24 },
                                { opacity: 1, x: 0, duration: 0.24, ease: 'power2.out', overwrite: true }
                            );
                    }
                }
                disconnectedCallback() {
                    for (const timer of this.timers.values()) clearTimeout(timer);
                    window.gsap?.killTweensOf(this.shadowRoot.querySelectorAll('.message'));
                    super.disconnectedCallback();
                }
                render() {
                    return html`${repeat(
                        this.items,
                        item => item.id,
                        item =>
                            html`<div
                                data-id=${item.id}
                                class=${'message ' + item.type}
                                role=${item.type === 'error' ? 'alert' : 'status'}
                                @mouseenter=${() => this.pause(item)}
                                @mouseleave=${() => this.resume(item)}
                                @focusin=${() => this.pause(item)}
                                @focusout=${() => this.resume(item)}
                            >
                                <span class="icon" aria-hidden="true">${item.type === 'success' ? '✓' : '!'}</span
                                ><ui-tooltip .content=${item.text}></ui-tooltip
                                ><button type="button" aria-label="关闭提示" @click=${() => this.close(item.id)}>×</button>
                            </div>`
                    )}`;
                }
            }
            customElements.define('ui-message', UiMessage);
            const messageHost = document.createElement('ui-message');
            document.body.append(messageHost);
            const message = (text, type = 'error') => messageHost.show(text, type);
            function formatDate(value) {
                if (!value) return '—';
                const timestamp = typeof value === 'number' || /^\d+$/.test(value);
                const date = timestamp ? new Date(Number(value) * 1000) : new Date(value);
                if (Number.isNaN(date.getTime())) return String(value);
                const pad = part => String(part).padStart(2, '0');
                return (
                    date.getFullYear() +
                    '-' +
                    pad(date.getMonth() + 1) +
                    '-' +
                    pad(date.getDate()) +
                    ' ' +
                    pad(date.getHours()) +
                    ':' +
                    pad(date.getMinutes()) +
                    ':' +
                    pad(date.getSeconds())
                );
            }
            const filters = [
                ['all', '全部状态'],
                ['available', '可用'],
                ['cooldown', '冷却中'],
                ['unavailable', '不可用']
            ];
            class UiButton extends LitElement {
                static properties = { label: { type: String }, variant: { type: String }, disabled: { type: Boolean } };
                createRenderRoot() {
                    return this;
                }
                render() {
                    return html`<button
                        type="button"
                        class="inline-flex min-h-9 items-center justify-center gap-2 rounded-lg border px-3 py-2 text-[13px] leading-[18px] font-medium disabled:cursor-not-allowed disabled:opacity-40 ${this
                            .variant === 'danger'
                            ? 'border-red-200 text-red-600 hover:bg-red-50'
                            : this.variant === 'primary'
                              ? 'border-brand bg-brand text-white hover:border-[#3d4450] hover:bg-[#3d4450]'
                              : 'border-line text-ink hover:bg-slate-50'}"
                        ?disabled=${this.disabled}
                        @click=${() => this.dispatchEvent(new CustomEvent('button-click', { bubbles: true, composed: true }))}
                    >
                        ${this.label}
                    </button>`;
                }
            }
            customElements.define('ui-button', UiButton);
            class UiSelect extends LitElement {
                static properties = { options: { attribute: false }, value: { type: String } };
                createRenderRoot() {
                    return this;
                }
                render() {
                    return html`<label class="sr-only" for="status">筛选账号状态</label
                        ><select
                            id="status"
                            class="h-9 min-w-0 flex-1 rounded-lg border border-line bg-white px-3 text-[13px] outline-none focus:border-brand sm:flex-none"
                            .value=${this.value}
                            @change=${e =>
                                this.dispatchEvent(
                                    new CustomEvent('select-change', { detail: { value: e.target.value }, bubbles: true, composed: true })
                                )}
                        >
                            ${(this.options || []).map(([value, label]) => html`<option value=${value}>${label}</option>`)}
                        </select>`;
                }
            }
            customElements.define('ui-select', UiSelect);
            class AccountCard extends LitElement {
                static properties = { account: { attribute: false }, busy: { type: Boolean } };
                createRenderRoot() {
                    return this;
                }
                date(value) {
                    return formatDate(value);
                }
                credits(value) {
                    return value == null ? '暂无数据' : Number(value).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
                }
                cooldownLeft(until) {
                    if (!until) return '';
                    const mins = Math.ceil((until * 1000 - Date.now()) / 60000);
                    if (mins <= 0) return '';
                    if (mins < 60) return mins + ' 分钟';
                    const hours = Math.floor(mins / 60);
                    const rem = mins % 60;
                    return hours + ' 小时' + (rem ? ' ' + rem + ' 分' : '');
                }
                connectedCallback() {
                    super.connectedCallback();
                    // 冷却倒计时自走:每 30s 重渲染一次。
                    this.timer = setInterval(() => this.requestUpdate(), 30000);
                }
                disconnectedCallback() {
                    super.disconnectedCallback();
                    clearInterval(this.timer);
                }
                render() {
                    const a = this.account || {};
                    const cooling = a.cooldown_until && a.cooldown_until * 1000 > Date.now();
                    const state = !a.available ? '不可用' : cooling ? '冷却中' : '可用';
                    const status = !a.available ? 'unavailable' : cooling ? 'cooldown' : 'available';
                    const error = a.unavailable_reason || a.error || '';
                    const action = name =>
                        this.dispatchEvent(
                            new CustomEvent('account-action', { detail: { action: name, email: a.email }, bubbles: true, composed: true })
                        );
                    return html`<article
                        class="h-full overflow-hidden rounded-xl border border-line bg-white p-0 hover:border-[#c9ced7] flex flex-col"
                        aria-label=${(a.email || '未知账号') + '，' + state}
                    >
                        <div class="flex-1 p-3">
                            <div class="flex items-start justify-between gap-3">
                                <div class="flex min-w-0 items-center gap-3">
                                    <div class="min-w-0">
                                        <h3 class="truncate text-[13px] font-semibold text-ink" title=${a.email || ''}>
                                            ${a.email || '未知账号'}
                                        </h3>
                                        ${a.tag ? html`<p class="truncate text-xs text-muted" title=${a.tag}>${a.tag}</p>` : ''}
                                    </div>
                                </div>
                                <div class="flex shrink-0 items-center gap-1.5">
                                    ${a.trial_days_left != null
                                        ? html`<span
                                              class="whitespace-nowrap text-xs text-muted"
                                              aria-label=${'试用剩余 ' + a.trial_days_left + ' 天'}
                                              >${a.trial_days_left} 天</span
                                          >`
                                        : ''}
                                    <span
                                        class="inline-flex shrink-0 items-center gap-[5px] rounded-md px-[7px] py-[3px] text-xs font-medium before:size-[5px] before:rounded-full before:bg-current data-[state=available]:bg-emerald-50 data-[state=available]:text-emerald-700 data-[state=cooldown]:bg-amber-50 data-[state=cooldown]:text-amber-700 data-[state=unavailable]:bg-red-50 data-[state=unavailable]:text-red-700"
                                        data-state=${status}
                                        >${state}</span
                                    >
                                </div>
                            </div>
                            <div
                                class="my-2 flex items-center justify-between gap-2 [&>div]:flex [&>div]:min-w-0 [&>div]:items-baseline [&>div]:gap-1.5"
                            >
                                <div>
                                    <p class="text-xs text-muted shrink-0">额度</p>
                                    <p
                                        class="text-lg leading-[1.3] font-semibold tracking-[-.4px] tabular-nums truncate"
                                        title=${this.credits(a.remaining_credits)}
                                    >
                                        ${this.credits(a.remaining_credits)}
                                    </p>
                                </div>
                                <p
                                    class="max-w-[40%] text-xs text-[#596373] truncate"
                                    title=${'订阅等级：' + (a.tier || (a.has_pro_features ? 'Pro' : '—'))}
                                >
                                    ${a.tier || (a.has_pro_features ? 'Pro' : '—')}
                                </p>
                            </div>
                            <div class="grid gap-0.5 border-t border-[#eff0f2] pt-1.5 text-xs leading-[18px]">
                                <dl
                                    class="grid grid-cols-2 gap-x-2 [&>div]:flex [&>div]:min-w-0 [&>div]:items-baseline [&>div]:gap-1 [&_dd]:min-w-0 [&_dd]:text-[#596373] [&_dt]:shrink-0 [&_dt]:whitespace-nowrap [&_dt]:text-muted"
                                >
                                    <div class="min-w-0">
                                        <dt>创建时间</dt>
                                        <dd class="truncate" title=${this.date(a.created_at)}>${this.date(a.created_at)}</dd>
                                    </div>
                                    <div class="min-w-0">
                                        <dt>额度同步</dt>
                                        <dd class="truncate" title=${this.date(a.info_fetched_at)}>${this.date(a.info_fetched_at)}</dd>
                                    </div>
                                </dl>
                            </div>
                            <div
                                class="mt-2 min-w-0 rounded-lg px-2 py-1.5 text-xs leading-[18px] data-[state=available]:bg-emerald-50 data-[state=available]:text-emerald-700 data-[state=cooldown]:bg-amber-50 data-[state=cooldown]:text-amber-700 data-[state=unavailable]:bg-red-50 data-[state=unavailable]:text-red-700"
                                data-state=${status}
                            >
                                <ui-tooltip
                                    .content=${error ||
                                    (cooling
                                        ? '预计恢复：' + this.date(a.cooldown_until) + '（' + this.cooldownLeft(a.cooldown_until) + '后）'
                                        : '无')}
                                ></ui-tooltip>
                            </div>
                        </div>
                        <div
                            class="px-3 pb-2 [&_button]:min-h-7 [&_button]:px-2 [&_button]:py-[3px] [&_button]:text-xs [&>ui-button:last-child]:ml-auto [&>ui-button:last-child>button]:border-transparent [&>ui-button:last-child>button]:bg-transparent [&>ui-button:last-child>button:hover]:bg-red-50 flex items-center gap-2"
                        >
                            <ui-button
                                class="inline-flex"
                                label="刷新额度"
                                .disabled=${this.busy}
                                @button-click=${() => action('refresh')}
                            ></ui-button
                            ><ui-button
                                class="inline-flex"
                                label="恢复"
                                .disabled=${this.busy || (!cooling && a.available)}
                                @button-click=${() => action('restore')}
                            ></ui-button>
                            <ui-button
                                class="inline-flex"
                                label="删除"
                                variant="danger"
                                .disabled=${this.busy}
                                @button-click=${() => action('delete')}
                            ></ui-button>
                        </div>
                    </article>`;
                }
            }
            customElements.define('account-card', AccountCard);
            class LogsPanel extends LitElement {
                static properties = {
                    request: { attribute: false },
                    items: { state: true },
                    page: { state: true },
                    total: { state: true },
                    pages: { state: true },
                    pageSize: { state: true },
                    requestId: { state: true },
                    createdAt: { state: true },
                    loading: { state: true },
                    error: { state: true },
                    detailId: { state: true },
                    detail: { state: true },
                    detailLoading: { state: true },
                    detailError: { state: true },
                    detailTab: { state: true }
                };
                constructor() {
                    super();
                    Object.assign(this, {
                        items: [],
                        page: 1,
                        total: 0,
                        pages: 0,
                        pageSize: 20,
                        requestId: '',
                        createdAt: '',
                        loading: false,
                        error: '',
                        filters: {},
                        detailId: '',
                        detail: null,
                        detailLoading: false,
                        detailError: '',
                        detailTab: 'inbound_json',
                        detailVersion: 0
                    });
                }
                createRenderRoot() {
                    return this;
                }
                updated() {
                    const dialog = this.querySelector('dialog');
                    if (this.detailId && !dialog.open) dialog.showModal();
                    else if (!this.detailId && dialog.open) dialog.close();
                }
                async load() {
                    if (this.loading) return;
                    this.loading = true;
                    this.error = '';
                    try {
                        let data = await this.request('list', { page: this.page, page_size: this.pageSize, ...this.filters });
                        if (data.total_pages && this.page > data.total_pages) {
                            this.page = data.total_pages;
                            data = await this.request('list', { page: this.page, page_size: this.pageSize, ...this.filters });
                        }
                        this.items = data.items || [];
                        this.total = data.total || 0;
                        this.pages = data.total_pages || 0;
                    } catch (error) {
                        this.error = error.message || '加载日志失败';
                        message(this.error);
                    } finally {
                        this.loading = false;
                    }
                }
                search(event) {
                    event.preventDefault();
                    if (this.loading) return;
                    const createdAt = this.createdAt ? new Date(this.createdAt).getTime() / 1000 : null;
                    if (createdAt != null && !Number.isSafeInteger(createdAt)) {
                        message('请输入有效的创建时间，精确到秒。');
                        return;
                    }
                    this.filters = {
                        ...(this.requestId.trim() ? { request_id: this.requestId.trim() } : {}),
                        ...(createdAt != null ? { created_at: createdAt } : {})
                    };
                    this.page = 1;
                    this.load();
                }
                reset() {
                    if (this.loading) return;
                    this.requestId = '';
                    this.createdAt = '';
                    this.filters = {};
                    this.page = 1;
                    this.load();
                }
                changePage(page) {
                    if (this.loading || page < 1 || page > this.pages) return;
                    this.page = page;
                    this.load();
                }
                async openDetail(requestId) {
                    const version = ++this.detailVersion;
                    this.detailId = requestId;
                    this.detail = null;
                    this.detailError = '';
                    this.detailLoading = true;
                    this.detailTab = 'inbound_json';
                    try {
                        const detail = await this.request('detail', { request_id: requestId });
                        if (version === this.detailVersion) this.detail = detail;
                    } catch (error) {
                        if (version === this.detailVersion) {
                            this.detailError = error.message || '加载详情失败';
                            message(this.detailError);
                        }
                    } finally {
                        if (version === this.detailVersion) this.detailLoading = false;
                    }
                }
                closeDetail() {
                    this.detailId = '';
                    this.detailVersion++;
                }
                formatBody(value) {
                    if (value == null) return '暂无记录';
                    if (value === '') return '（空内容）';
                    try {
                        return JSON.stringify(JSON.parse(value), null, 2);
                    } catch {

                                              粘贴单个账号 JSON 或账号 JSON 数组，按 user.email 更新账号。
                                          </p>
                                          <label for="account-json" class="mt-5 block text-xs font-medium">账号 JSON</label
                                          ><textarea
                                              id="account-json"
                                              class="mt-2 h-64 w-full resize-y rounded-lg border border-line bg-slate-50 p-4 font-mono text-xs leading-5 outline-none focus:border-brand focus:bg-white"
                                              .value=${this.source}
                                              @input=${e => (this.source = e.target.value)}
                                              placeholder='[{"tag":"主账号","user":{"email":"name@example.com"},"access_token":"rca_...","refresh_token":"..."}]'
                                          ></textarea>
                                      </div>
                                      <div class="flex justify-end gap-2 border-t border-line bg-[#fafbfc] px-6 py-4 max-[700px]:p-4">
                                          <button
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px]"
                                              @click=${() => (this.dialog = false)}
                                          >
                                              取消</button
                                          ><button
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px] bg-brand text-white disabled:opacity-50"
                                              ?disabled=${this.importing}
                                              @click=${this.importAccounts}
                                          >
                                              ${this.importing ? '导入中…' : '确定导入'}
                                          </button>
                                      </div>
                                  </section>
                              </div>`
                            : ''}
                        ${this.keyPrompt
                            ? html`<div class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/40 p-4">
                                  <form
                                      class="max-h-[calc(100dvh-32px)] overflow-y-auto rounded-xl border border-line p-0 shadow-[0_24px_80px_#10182826] [&_input]:rounded-lg [&_textarea]:rounded-lg max-[700px]:[&_input]:text-base max-[700px]:[&_textarea]:text-base w-full max-w-sm bg-white"
                                      role="dialog"
                                      aria-modal="true"
                                      aria-labelledby="key-title"
                                      @submit=${this.saveKey}
                                  >
                                      <div class="flex items-center justify-between gap-4 border-b border-line px-6 py-5 max-[700px]:p-4">
                                          <h2 id="key-title" class="text-base font-semibold">设置 API Key</h2>
                                      </div>
                                      <div class="p-6 max-[700px]:p-4">
                                          <p class="mt-2 text-xs leading-5 text-muted">
                                              网关配置了 API_KEY，请输入后访问管理接口。Key 保存在当前浏览器。
                                          </p>
                                          <label for="api-key" class="mt-4 block text-xs font-medium">API Key</label
                                          ><input
                                              id="api-key"
                                              type="password"
                                              autocomplete="current-password"
                                              class="mt-2 h-11 w-full rounded-lg border border-line px-3 text-sm outline-none focus:border-brand"
                                              .value=${this.keyDraft}
                                              @input=${e => (this.keyDraft = e.target.value)}
                                              placeholder="API Key"
                                          />
                                      </div>
                                      <div class="flex justify-end gap-2 border-t border-line bg-[#fafbfc] px-6 py-4 max-[700px]:p-4">
                                          <button
                                              type="button"
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px]"
                                              @click=${() => (this.keyPrompt = false)}
                                          >
                                              取消</button
                                          ><button
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px] bg-brand text-white"
                                          >
                                              保存并重试
                                          </button>
                                      </div>
                                  </form>
                              </div>`
                            : ''}
                    </main>`;
                }
            }
            customElements.define('account-console', AccountConsole);
        </script>
    </body>
</html>
