<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>Raycast 账号管理</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme {
                --color-brand: #2563eb;
                --color-ink: #182033;
                --color-muted: #778198;
                --color-line: #e8ebf1;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            body {
                margin: 0;
                color: #182033;
                background: #f7f8fb;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
            }
            account-console {
                display: block;
                height: 100dvh;
                overflow: hidden;
            }
            .thin-scrollbar {
                scrollbar-width: thin;
                scrollbar-color: #d9dce5 transparent;
            }
            .thin-scrollbar::-webkit-scrollbar {
                width: 7px;
            }
            .thin-scrollbar::-webkit-scrollbar-thumb {
                background: #d9dce5;
                border-radius: 99px;
            }
        </style>
    </head>
    <body>
        <account-console></account-console>
        <script type="module">
            import { LitElement, html } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
            const filters = [
                ['all', '全部账号'],
                ['available', '可用'],
                ['cooldown', '冷却中'],
                ['unavailable', '不可用']
            ];
            class UiButton extends LitElement {
                static properties = { label: { type: String }, variant: { type: String }, disabled: { type: Boolean } };
                createRenderRoot() {
                    return this;
                }
                render() {
                    return html`<button
                        class="inline-flex h-8 items-center justify-center rounded-lg border px-2.5 text-xs font-medium transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40 ${this
                            .variant === 'danger'
                            ? 'border-rose-200 text-rose-600 hover:bg-rose-50'
                            : this.variant === 'primary'
                              ? 'border-brand bg-brand text-white hover:bg-blue-700'
                              : 'border-line text-ink'}"
                        ?disabled=${this.disabled}
                        @click=${() => this.dispatchEvent(new CustomEvent('button-click', { bubbles: true, composed: true }))}
                    >
                        ${this.label}
                    </button>`;
                }
            }
            customElements.define('ui-button', UiButton);
            class UiSelect extends LitElement {
                static properties = { options: { attribute: false }, value: { type: String } };
                createRenderRoot() {
                    return this;
                }
                render() {
                    return html`<label class="sr-only" for="status">筛选账号状态</label
                        ><select
                            id="status"
                            class="h-10 min-w-0 flex-1 rounded-lg border border-line bg-white px-3 text-sm outline-none focus:border-brand sm:flex-none"
                            .value=${this.value}
                            @change=${e =>
                                this.dispatchEvent(
                                    new CustomEvent('select-change', { detail: { value: e.target.value }, bubbles: true, composed: true })
                                )}
                        >
                            ${(this.options || []).map(([value, label]) => html`<option value=${value}>${label}</option>`)}
                        </select>`;
                }
            }
            customElements.define('ui-select', UiSelect);
            class AccountCard extends LitElement {
                static properties = { account: { attribute: false }, busy: { type: Boolean } };
                createRenderRoot() {
                    return this;
                }
                date(value) {
                    if (!value) return '—';
                    const date = typeof value === 'number' ? new Date(value * 1000) : new Date(value);
                    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { hour12: false });
                }
                credits(value) {
                    return value == null ? '暂无数据' : Number(value).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
                }
                render() {
                    const a = this.account || {};
                    const cooling = a.cooldown_until && a.cooldown_until * 1000 > Date.now();
                    const state = !a.available ? '不可用' : cooling ? '冷却中' : '可用';
                    const badge =
                        state === '可用'
                            ? 'bg-emerald-50 text-emerald-700'
                            : state === '冷却中'
                              ? 'bg-amber-50 text-amber-700'
                              : 'bg-rose-50 text-rose-700';
                    const error = a.unavailable_reason || a.error || '';
                    const action = name =>
                        this.dispatchEvent(
                            new CustomEvent('account-action', { detail: { action: name, email: a.email }, bubbles: true, composed: true })
                        );
                    return html`<article
                        class="flex h-full flex-col rounded-2xl border border-line bg-white p-5 shadow-[0_2px_12px_rgba(23,32,51,0.025)] transition hover:-translate-y-0.5 hover:shadow-lg"
                    >
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex min-w-0 items-center gap-3">
                                <div class="grid size-10 shrink-0 place-items-center rounded-xl bg-blue-50 font-semibold text-brand">
                                    ${(a.email || '?').slice(0, 1).toUpperCase()}
                                </div>
                                <div class="min-w-0">
                                    <h3 class="truncate text-sm font-semibold text-ink" title=${a.email || ''}>${a.email || '未知账号'}</h3>
                                    <p class="mt-1 truncate text-xs text-muted" title=${a.tag || '未设置标签'}>${a.tag || '未设置标签'}</p>
                                </div>
                            </div>
                            <span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-medium ${badge}">${state}</span>
                        </div>
                        <div class="my-4 h-px bg-slate-100"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-[11px] text-muted">剩余额度</p>
                                <p class="mt-1 truncate text-sm font-semibold text-ink" title=${this.credits(a.remaining_credits)}>
                                    ${this.credits(a.remaining_credits)}<span class="ml-1 text-[11px] font-normal text-muted">credits</span>
                                </p>
                            </div>
                            <div>
                                <p class="text-[11px] text-muted">订阅等级</p>
                                <p class="mt-1 truncate text-sm font-semibold text-ink" title=${a.tier || ''}>
                                    ${a.tier || (a.has_pro_features ? 'Pro' : '—')}
                                </p>
                            </div>
                        </div>
                        <div class="mt-4 grid grid-cols-1 gap-1.5 border-t border-slate-100 pt-3 text-[11px] text-muted">
                            <p class="truncate" title=${'错误：' + (error || '无')}>
                                错误：<span class=${error ? 'text-rose-600' : 'text-slate-400'}>${error || '无'}</span>
                            </p>
                            <p class="truncate" title=${'创建：' + this.date(a.created_at)}>创建：${this.date(a.created_at)}</p>
                            <p class="truncate" title=${'最近更新：' + this.date(a.updated_at)}>最近更新：${this.date(a.updated_at)}</p>
                            <p class="truncate" title=${'额度同步：' + this.date(a.info_fetched_at)}>
                                额度同步：${this.date(a.info_fetched_at)}
                            </p>
                            ${a.trial_days_left != null ? html`<p class="truncate">试用剩余：${a.trial_days_left} 天</p>` : ''}
                        </div>
                        <div class="mt-auto flex items-center gap-2 border-t border-slate-100 pt-3">
                            <ui-button label="刷新" .disabled=${this.busy} @button-click=${() => action('refresh')}></ui-button
                            ><ui-button
                                label="删除"
                                variant="danger"
                                .disabled=${this.busy}
                                @button-click=${() => action('delete')}
                            ></ui-button
                            ><ui-button
                                label="恢复"
                                .disabled=${this.busy || (!cooling && a.available)}
                                @button-click=${() => action('restore')}
                            ></ui-button>
                        </div>
                    </article>`;
                }
            }
            customElements.define('account-card', AccountCard);
            class AccountConsole extends LitElement {
                static properties = {
                    accounts: { state: true },
                    page: { state: true },
                    total: { state: true },
                    pages: { state: true },
                    status: { state: true },
                    loading: { state: true },
                    workingEmail: { state: true },
                    error: { state: true },
                    notice: { state: true },
                    dialog: { state: true },
                    source: { state: true },
                    importing: { state: true },
                    apiKey: { state: true },
                    keyPrompt: { state: true },
                    keyDraft: { state: true }
                };
                constructor() {
                    super();
                    Object.assign(this, {
                        accounts: [],
                        page: 1,
                        total: 0,
                        pages: 0,
                        status: 'all',
                        loading: false,
                        workingEmail: '',
                        error: '',
                        notice: '',
                        dialog: false,
                        source: '',
                        importing: false,
                        apiKey: localStorage.getItem('raycast2api.apiKey') || '',
                        keyPrompt: false,
                        keyDraft: ''
                    });
                    this.load();
                }
                createRenderRoot() {
                    return this;
                }
                async request(path, body) {
                    const response = await fetch('/v1/accounts/' + path, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...(this.apiKey ? { Authorization: 'Bearer ' + this.apiKey } : {}) },
                        body: JSON.stringify(body)
                    });
                    const result = await response.json().catch(() => ({}));
                    if (response.status === 401) {
                        this.keyDraft = this.apiKey;
                        this.keyPrompt = true;
                        throw new Error('请设置有效的 API Key 后再访问管理接口。');
                    }
                    if (!response.ok || result.code >= 400) throw new Error(result.message || '请求失败 (' + response.status + ')');
                    return result.data;
                }
                async load() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const data = await this.request('list', { page: this.page, page_size: 12, status: this.status });
                        this.accounts = data.items || [];
                        this.total = data.total || 0;
                        this.pages = data.total_pages || 0;
                        if (this.pages && this.page > this.pages) {
                            this.page = this.pages;
                            await this.load();
                        }
                    } catch (e) {
                        this.error = e.message || '加载账号失败';
                    } finally {
                        this.loading = false;
                    }
                }
                async importAccounts() {
                    let records;
                    try {
                        records = JSON.parse(this.source.trim());
                        if (!Array.isArray(records)) records = [records];
                        if (
                            !records.length ||
                            records.some(
                                x =>
                                    !x ||
                                    typeof x !== 'object' ||
                                    Array.isArray(x) ||
                                    typeof x.user?.email !== 'string' ||
                                    typeof x.access_token !== 'string' ||
                                    !x.access_token
                            )
                        )
                            throw new Error('每个账号都需要包含 user.email 和 access_token。');
                    } catch (e) {
                        this.notice = e instanceof SyntaxError ? 'JSON 格式无效，请检查后重试。' : e.message;
                        return;
                    }
                    this.importing = true;
                    this.notice = '';
                    try {
                        const data = await this.request(
                            'create',
                            records.length === 1 && !this.source.trim().startsWith('[') ? records[0] : records
                        );
                        const results = data.results || [data.result];
                        this.notice =
                            '导入完成：新增 ' +
                            results.filter(x => x === 'inserted').length +
                            '，更新 ' +
                            results.filter(x => x === 'updated').length +
                            '，未变化 ' +
                            results.filter(x => x === 'unchanged').length;
                        this.dialog = false;
                        this.source = '';
                        this.status = 'all';
                        this.page = 1;
                        await this.load();
                    } catch (e) {
                        this.notice = e.message || '导入失败';
                    } finally {
                        this.importing = false;
                    }
                }
                async saveKey(e) {
                    e.preventDefault();
                    this.apiKey = this.keyDraft.trim();
                    if (this.apiKey) localStorage.setItem('raycast2api.apiKey', this.apiKey);
                    else localStorage.removeItem('raycast2api.apiKey');
                    this.keyPrompt = false;
                    await this.load();
                }
                chooseStatus(e) {
                    this.status = e.detail.value;
                    this.page = 1;
                    this.load();
                }
                async accountAction(e) {
                    const { action, email } = e.detail;
                    if (this.workingEmail) return;
                    if (action === 'delete' && !confirm('确定删除账号 ' + email + ' 吗？')) return;
                    this.workingEmail = email;
                    this.notice = '';
                    try {
                        await this.request(action, { email });
                        this.notice = action === 'delete' ? '账号已删除' : action === 'restore' ? '账号已恢复并完成校验' : '账号额度已刷新';
                        await this.load();
                    } catch (error) {
                        this.notice = error.message || '操作失败';
                    } finally {
                        this.workingEmail = '';
                    }
                }
                render() {
                    return html` <main class="flex h-full flex-col overflow-hidden">
                        <header class="shrink-0 border-b border-line bg-white px-5 sm:px-8">
                            <div class="mx-auto flex min-h-[82px] max-w-7xl flex-wrap items-center justify-between gap-3 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="grid size-10 place-items-center rounded-xl bg-brand text-lg font-bold text-white">R</div>
                                    <div>
                                        <h1 class="text-base font-semibold tracking-tight text-ink sm:text-lg">Raycast 账号管理</h1>
                                        <p class="mt-0.5 text-xs text-muted">账号池状态与额度一览</p>
                                    </div>
                                </div>
                                <div class="flex w-full items-center justify-between gap-2 sm:w-auto">
                                    <ui-select .options=${filters} .value=${this.status} @select-change=${this.chooseStatus}></ui-select>
                                    <ui-button
                                        label="导入账号"
                                        variant="primary"
                                        @button-click=${() => {
                                            this.dialog = true;
                                            this.notice = '';
                                        }}
                                    ></ui-button>
                                </div>
                            </div>
                        </header>
                        <section class="thin-scrollbar min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-8 sm:py-6" aria-label="账号列表">
                            <div class="mx-auto max-w-7xl">
                                <div class="mb-5 flex items-center justify-between gap-4">
                                    <h2 class="text-sm font-semibold text-ink">账号列表</h2>
                                    ${this.notice
                                        ? html`<p
                                              role="status"
                                              class="max-w-[65%] truncate text-right text-xs text-brand"
                                              title=${this.notice}
                                          >
                                              ${this.notice}
                                          </p>`
                                        : ''}
                                </div>
                                ${this.error
                                    ? html`<div
                                          class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-4 text-sm text-rose-700"
                                      >
                                          <span>${this.error}</span
                                          ><button
                                              class="rounded-lg border border-rose-200 bg-white px-3 py-1.5 text-xs"
                                              @click=${() => {
                                                  this.keyDraft = this.apiKey;
                                                  this.keyPrompt = true;
                                              }}
                                          >
                                              设置 API Key
                                          </button>
                                      </div>`
                                    : this.loading && !this.accounts.length
                                      ? html`<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                                            ${[1, 2, 3].map(() => html`<div class="h-48 animate-pulse rounded-2xl bg-white"></div>`)}
                                        </div>`
                                      : this.accounts.length
                                        ? html`
                                              <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" @account-action=${this.accountAction}>
                                                  ${this.accounts.map(
                                                      account =>
                                                          html`<account-card
                                                              .account=${account}
                                                              .busy=${this.workingEmail === account.email}
                                                          ></account-card>`
                                                  )}
                                              </div>
                                          `
                                        : html`<div
                                              class="flex min-h-64 flex-col items-center justify-center rounded-2xl border border-dashed border-slate-200 bg-white/70 px-6 text-center"
                                          >
                                              <div class="grid size-12 place-items-center rounded-2xl bg-blue-50 text-xl text-brand">
                                                  ＋
                                              </div>
                                              <h3 class="mt-4 text-sm font-semibold text-ink">
                                                  ${this.status === 'all' ? '还没有账号' : '没有符合条件的账号'}
                                              </h3>
                                              <p class="mt-1 text-xs text-muted">导入账号 JSON 后会显示在这里</p>
                                              ${this.status === 'all'
                                                  ? html`<button
                                                        class="mt-4 rounded-lg bg-brand px-4 py-2 text-xs font-medium text-white"
                                                        @click=${() => (this.dialog = true)}
                                                    >
                                                        导入账号
                                                    </button>`
                                                  : ''}
                                          </div>`}
                            </div>
                        </section>
                        <footer class="shrink-0 border-t border-line bg-white px-5 sm:px-8">
                            <div class="mx-auto flex min-h-[66px] max-w-7xl items-center justify-between gap-4">
                                <p class="truncate text-xs text-muted">
                                    共 ${this.total} 个账号<span class="mx-2 text-slate-300">·</span>${this.total
                                        ? '第 ' + this.page + ' / ' + this.pages + ' 页'
                                        : '暂无账号'}
                                </p>
                                <div class="flex shrink-0 items-center gap-2">
                                    <ui-button
                                        label="‹"
                                        .disabled=${this.page <= 1 || this.loading}
                                        @button-click=${() => {
                                            this.page--;
                                            this.load();
                                        }}
                                    ></ui-button
                                    ><span class="min-w-16 text-center text-xs font-medium">${this.page} / ${this.pages || 1}</span
                                    ><ui-button
                                        label="›"
                                        .disabled=${this.page >= this.pages || this.loading}
                                        @button-click=${() => {
                                            this.page++;
                                            this.load();
                                        }}
                                    ></ui-button>
                                </div>
                            </div>
                        </footer>
                        ${this.dialog
                            ? html`<div
                                  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-[2px]"
                                  @click=${e => {
                                      if (e.target === e.currentTarget) this.dialog = false;
                                  }}
                              >
                                  <section
                                      role="dialog"
                                      aria-modal="true"
                                      aria-labelledby="import-title"
                                      class="max-h-[calc(100dvh-32px)] w-full max-w-xl overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl sm:p-6"
                                  >
                                      <h2 id="import-title" class="text-base font-semibold">导入账号</h2>
                                      <p class="mt-1 text-xs leading-5 text-muted">
                                          粘贴单个账号 JSON 或账号 JSON 数组，按 user.email 更新账号。
                                      </p>
                                      <textarea
                                          class="mt-4 h-64 w-full resize-y rounded-xl border border-line bg-slate-50 p-4 font-mono text-xs leading-5 outline-none focus:border-brand focus:bg-white"
                                          .value=${this.source}
                                          @input=${e => (this.source = e.target.value)}
                                          placeholder='[{"tag":"主账号","user":{"email":"name@example.com"},"access_token":"rca_...","refresh_token":"..."}]'
                                      ></textarea
                                      >${this.notice ? html`<p role="alert" class="mt-2 text-xs text-rose-600">${this.notice}</p>` : ''}
                                      <div class="mt-4 flex justify-end gap-2">
                                          <button
                                              class="h-10 rounded-lg border border-line px-4 text-sm"
                                              @click=${() => (this.dialog = false)}
                                          >
                                              取消</button
                                          ><button
                                              class="h-10 rounded-lg bg-brand px-4 text-sm font-medium text-white disabled:opacity-50"
                                              ?disabled=${this.importing}
                                              @click=${this.importAccounts}
                                          >
                                              ${this.importing ? '导入中…' : '确定导入'}
                                          </button>
                                      </div>
                                  </section>
                              </div>`
                            : ''}
                        ${this.keyPrompt
                            ? html`<div class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/40 p-4">
                                  <form class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl" @submit=${this.saveKey}>
                                      <h2 class="text-base font-semibold">设置 API Key</h2>
                                      <p class="mt-2 text-xs leading-5 text-muted">
                                          网关配置了 API_KEY，请输入后访问管理接口。Key 保存在当前浏览器。
                                      </p>
                                      <input
                                          type="password"
                                          autocomplete="current-password"
                                          class="mt-4 h-11 w-full rounded-lg border border-line px-3 text-sm outline-none focus:border-brand"
                                          .value=${this.keyDraft}
                                          @input=${e => (this.keyDraft = e.target.value)}
                                          placeholder="API Key"
                                      />
                                      <div class="mt-4 flex justify-end gap-2">
                                          <button
                                              type="button"
                                              class="h-10 rounded-lg border border-line px-4 text-sm"
                                              @click=${() => (this.keyPrompt = false)}
                                          >
                                              取消</button
                                          ><button class="h-10 rounded-lg bg-brand px-4 text-sm font-medium text-white">保存并重试</button>
                                      </div>
                                  </form>
                              </div>`
                            : ''}
                    </main>`;
                }
            }
            customElements.define('account-console', AccountConsole);
        </script>
    </body>
</html>
