<!doctype html>
<html lang="zh-CN" class="h-full w-full overflow-hidden">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>Raycast 管理控制台</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
        <style>
            .flatpickr-calendar.raycast-calendar {
                position: fixed;
                margin: 0;
                padding: 6px;
                border: 1px solid #e4e7ec;
                border-radius: 12px;
                background: white;
                color: #242933;
                font:
                    13px/1.5 system-ui,
                    sans-serif;
                box-shadow: 0 8px 24px #1018281a;
                z-index: 60;
            }
            .raycast-calendar::before,
            .raycast-calendar::after {
                display: none;
            }
            .raycast-calendar .flatpickr-day {
                border-radius: 8px;
            }
            .raycast-calendar .flatpickr-day.selected {
                background: #262b33;
                border-color: #262b33;
            }
            .raycast-calendar .flatpickr-day:hover {
                background: #f1f5f9;
                border-color: #f1f5f9;
                color: #242933;
            }
            .raycast-calendar .flatpickr-day:focus-visible,
            .raycast-calendar button:focus-visible {
                outline: 2px solid #3b82f6;
                outline-offset: -2px;
            }
            .raycast-calendar .flatpickr-time {
                border-color: #e4e7ec;
                margin-top: 6px;
            }
            .raycast-calendar .picker-actions {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                border-top: 1px solid #e4e7ec;
                padding: 8px 4px 2px;
            }
            .raycast-calendar .picker-actions button {
                cursor: pointer;
                border: 1px solid #e4e7ec;
                border-radius: 8px;
                background: white;
                padding: 6px 12px;
                font: inherit;
            }
            .raycast-calendar .picker-actions button:last-child {
                background: #262b33;
                border-color: #262b33;
                color: white;
            }
        </style>
        <style type="text/tailwindcss">
            @theme {
                --color-brand: #262b33;
                --color-ink: #242933;
                --color-muted: #667080;
                --color-line: #e4e7ec;
            }
        </style>
    </head>
    <body
        class="m-0 h-full w-full overflow-hidden bg-[#f7f8fa] font-sans text-ink [&_button]:cursor-pointer [&_select]:cursor-pointer [&_button]:transition-colors [&_button]:duration-150 [&_button:disabled]:cursor-not-allowed [&_button:focus-visible]:outline-3 [&_input:focus-visible]:outline-3 [&_select:focus-visible]:outline-3 [&_textarea:focus-visible]:outline-3 [&_:focus-visible]:outline-offset-3 [&_:focus-visible]:outline-blue-500/35 motion-reduce:[&_*]:animate-none motion-reduce:[&_*]:transition-none"
    >
        <account-console class="block h-dvh overflow-hidden"></account-console>
        <script type="module">
            import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
            import { repeat } from 'https://cdn.jsdelivr.net/npm/lit-html@3.3.1/directives/repeat.js';
            import { computePosition, autoUpdate, offset, flip, shift } from 'https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.8.0/+esm';
            import dayjs from 'https://cdn.jsdelivr.net/npm/dayjs@1.11.23/+esm';
            import customParseFormat from 'https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/customParseFormat.js/+esm';
            import flatpickr from 'https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/+esm';
            import { Mandarin } from 'https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js/+esm';
            dayjs.extend(customParseFormat);
            const motionEnabled = () => window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches;
            class UiTooltip extends LitElement {
                static properties = { content: { type: String } };
                static styles = css`
                    :host {
                        display: block;
                        min-width: 0;
                    }
                    .trigger {
                        display: block;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                        outline-offset: 3px;
                    }
                    .trigger:focus-visible {
                        outline: 2px solid #3b82f6;
                    }
                    .tip {
                        position: fixed;
                        inset: auto;
                        margin: 0;
                        box-sizing: border-box;
                        width: max-content;
                        max-width: min(420px, calc(100vw - 24px));
                        max-height: min(360px, calc(100dvh - 24px));
                        overflow: visible;
                        border: 0;
                        padding: 0;
                        background: transparent;
                    }
                    .content {
                        box-sizing: border-box;
                        max-height: inherit;
                        overflow: auto;
                        border-radius: 8px;
                        padding: 9px 12px;
                        background: #242933;
                        color: white;
                        font:
                            12px/1.6 system-ui,
                            sans-serif;
                        white-space: pre-wrap;
                        overflow-wrap: anywhere;
                        box-shadow: 0 6px 24px #10182826;
                    }
                `;
                async show() {
                    clearTimeout(this.hideTimer);
                    if (!this.content) return;
                    await this.updateComplete;
                    if (!this.isConnected) return;
                    const trigger = this.shadowRoot.querySelector('.trigger');
                    if (trigger.scrollWidth <= trigger.clientWidth) {
                        this.hide();
                        return;
                    }
                    const tip = this.shadowRoot.querySelector('.tip');
                    const content = this.shadowRoot.querySelector('.content');
                    const opening = !tip.matches(':popover-open');
                    window.gsap?.killTweensOf(content);
                    this.cleanupPosition?.();
                    this.cleanupPosition = null;
                    if (opening) {
                        tip.style.visibility = 'hidden';
                        tip.showPopover();
                    }
                    const update = async () => {
                        if (trigger.scrollWidth <= trigger.clientWidth) {
                            this.hide();
                            return;
                        }
                        try {
                            const { x, y } = await computePosition(trigger, tip, {
                                strategy: 'fixed',
                                placement: 'bottom-start',
                                middleware: [offset(8), flip({ padding: 12 }), shift({ padding: 12, crossAxis: true })]
                            });
                            if (this.updatePosition !== update || !this.isConnected) return;
                            Object.assign(tip.style, { left: x + 'px', top: y + 'px', visibility: 'visible' });
                        } catch (error) {
                            if (this.updatePosition === update) this.hide();
                            console.warn('Tooltip 定位失败:', error);
                        }
                    };
                    this.updatePosition = update;
                    await update();
                    if (this.updatePosition !== update) return;
                    this.cleanupPosition = autoUpdate(trigger, tip, update, { animationFrame: true });
                    if (motionEnabled()) {
                        if (opening) window.gsap.set(content, { opacity: 0, y: 4 });
                        window.gsap.to(content, { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out', overwrite: true });
                    } else if (window.gsap) window.gsap.set(content, { opacity: 1, y: 0 });
                }
                updated() {
                    this.updatePosition?.();
                }
                hide() {
                    clearTimeout(this.hideTimer);
                    this.updatePosition = null;
                    this.cleanupPosition?.();
                    this.cleanupPosition = null;
                    const tip = this.shadowRoot?.querySelector('.tip');
                    if (!tip?.matches(':popover-open')) return;
                    const content = this.shadowRoot.querySelector('.content');
                    window.gsap?.killTweensOf(content);
                    if (this.isConnected && motionEnabled())
                        window.gsap.to(content, {
                            opacity: 0,
                            y: 4,
                            duration: 0.12,
                            ease: 'power1.out',
                            onComplete: () => tip.hidePopover()
                        });
                    else tip.hidePopover();
                }
                scheduleHide() {
                    this.hideTimer = setTimeout(() => this.hide(), 120);
                }
                disconnectedCallback() {
                    this.hide();
                    super.disconnectedCallback();
                }
                render() {
                    return html`<span
                            class="trigger"
                            tabindex="0"
                            aria-describedby="tooltip"
                            @mouseenter=${this.show}
                            @mouseleave=${this.scheduleHide}
                            @focus=${this.show}
                            @blur=${this.scheduleHide}
                            @keydown=${e => {
                                if (e.key === 'Escape') this.hide();
                            }}
                            ><slot>${this.content}</slot></span
                        >
                        <div
                            id="tooltip"
                            class="tip"
                            role="tooltip"
                            popover="manual"
                            @mouseenter=${() => clearTimeout(this.hideTimer)}
                            @mouseleave=${this.scheduleHide}
                            @keydown=${e => {
                                if (e.key === 'Escape') this.hide();
                            }}
                        >
                            <div class="content">${this.content}</div>
                        </div>`;
                }
            }
            customElements.define('ui-tooltip', UiTooltip);
            class UiMessage extends LitElement {
                static properties = { items: { state: true } };
                static styles = css`
                    :host {
                        position: fixed;
                        inset: 20px 20px auto auto;
                        margin: 0;
                        padding: 0;
                        border: 0;
                        width: min(440px, calc(100vw - 32px));
                        overflow: visible;
                        background: transparent;
                        color: #242933;
                        font:
                            13px/20px system-ui,
                            sans-serif;
                    }
                    .message {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        margin-bottom: 10px;
                        padding: 10px 12px;
                        border: 1px solid #e4e7ec;
                        border-radius: 10px;
                        background: white;
                        box-shadow: 0 6px 24px #1018281a;
                    }
                    .icon {
                        flex: none;
                        display: grid;
                        place-items: center;
                        width: 18px;
                        height: 18px;
                        border-radius: 50%;
                        font-size: 12px;
                        font-weight: 600;
                        background: #fef2f2;
                        color: #b91c1c;
                    }
                    .success .icon {
                        background: #ecfdf5;
                        color: #047857;
                    }
                    ui-tooltip {
                        flex: 1;
                        min-width: 0;
                    }
                    button {
                        flex: none;
                        width: 28px;
                        height: 28px;
                        border: 0;
                        border-radius: 5px;
                        background: transparent;
                        color: #667080;
                        font: inherit;
                        font-size: 18px;
                        cursor: pointer;
                    }
                    button:hover {
                        background: #f1f5f9;
                    }
                    button:focus-visible {
                        outline: 2px solid #3b82f6;
                    }
                `;
                constructor() {
                    super();
                    this.items = [];
                    this.timers = new Map();
                    this.nextId = 0;
                }
                connectedCallback() {
                    super.connectedCallback();
                    this.setAttribute('popover', 'manual');
                }
                show(text, type = 'error') {
                    const item = { id: ++this.nextId, text: String(text), type };
                    this.items = [...this.items, item];
                    this.resume(item);
                }
                pause(item) {
                    clearTimeout(this.timers.get(item.id));
                }
                resume(item) {
                    this.pause(item);
                    if (!item.closing)
                        this.timers.set(
                            item.id,
                            setTimeout(() => this.close(item.id), item.type === 'error' ? 8000 : 4000)
                        );
                }
                close(id) {
                    const item = this.items.find(item => item.id === id);
                    if (!item || item.closing) return;
                    item.closing = true;
                    this.pause(item);
                    this.timers.delete(id);
                    const node = this.shadowRoot.querySelector('[data-id="' + id + '"]');
                    const remove = () => {
                        const positions = new Map(
                            [...this.shadowRoot.querySelectorAll('.message')].map(element => [element, element.getBoundingClientRect().top])
                        );
                        this.items = this.items.filter(item => item.id !== id);
                        this.updateComplete.then(() => {
                            if (!this.isConnected || !motionEnabled()) return;
                            for (const element of this.shadowRoot.querySelectorAll('.message')) {
                                const y = positions.get(element) - element.getBoundingClientRect().top;
                                if (y && !this.items.find(item => item.id === Number(element.dataset.id))?.closing)
                                    window.gsap.fromTo(element, { y }, { y: 0, duration: 0.2, ease: 'power2.out', overwrite: 'auto' });
                            }
                        });
                    };
                    if (node && motionEnabled())
                        window.gsap.to(node, {
                            opacity: 0,
                            x: 20,
                            duration: 0.18,
                            ease: 'power1.out',
                            overwrite: true,
                            onComplete: remove
                        });
                    else remove();
                }
                updated() {
                    if (this.items.length) {
                        if (this.matches(':popover-open')) this.hidePopover();
                        this.showPopover();
                    } else if (!this.items.length && this.matches(':popover-open')) this.hidePopover();
                    for (const node of this.shadowRoot.querySelectorAll('.message')) {
                        if (node.dataset.entered) continue;
                        node.dataset.entered = 'true';
                        if (motionEnabled())
                            window.gsap.fromTo(
                                node,
                                { opacity: 0, x: 24 },
                                { opacity: 1, x: 0, duration: 0.24, ease: 'power2.out', overwrite: true }
                            );
                    }
                }
                disconnectedCallback() {
                    for (const timer of this.timers.values()) clearTimeout(timer);
                    window.gsap?.killTweensOf(this.shadowRoot.querySelectorAll('.message'));
                    super.disconnectedCallback();
                }
                render() {
                    return html`${repeat(
                        this.items,
                        item => item.id,
                        item =>
                            html`<div
                                data-id=${item.id}
                                class=${'message ' + item.type}
                                role=${item.type === 'error' ? 'alert' : 'status'}
                                @mouseenter=${() => this.pause(item)}
                                @mouseleave=${() => this.resume(item)}
                                @focusin=${() => this.pause(item)}
                                @focusout=${() => this.resume(item)}
                            >
                                <span class="icon" aria-hidden="true">${item.type === 'success' ? '✓' : '!'}</span
                                ><ui-tooltip .content=${item.text}></ui-tooltip
                                ><button type="button" aria-label="关闭提示" @click=${() => this.close(item.id)}>×</button>
                            </div>`
                    )}`;
                }
            }
            customElements.define('ui-message', UiMessage);
            const messageHost = document.createElement('ui-message');
            document.body.append(messageHost);
            const message = (text, type = 'error') => messageHost.show(text, type);
            function formatDate(value) {
                if (!value) return '—';
                const timestamp = typeof value === 'number' || /^\d+$/.test(value);
                const date = timestamp ? dayjs.unix(Number(value)) : dayjs(value);
                return date.isValid() ? date.format('YYYY-MM-DD HH:mm:ss') : String(value);
            }
            const filters = [
                ['all', '全部状态'],
                ['available', '可用'],
                ['cooldown', '冷却中'],
                ['unavailable', '不可用']
            ];
            class UiButton extends LitElement {
                static properties = { label: { type: String }, variant: { type: String }, disabled: { type: Boolean } };
                createRenderRoot() {
                    return this;
                }
                render() {
                    return html`<button
                        type="button"
                        class="inline-flex min-h-9 items-center justify-center gap-2 rounded-lg border px-3 py-2 text-[13px] leading-[18px] font-medium disabled:cursor-not-allowed disabled:opacity-40 ${this
                            .variant === 'danger'
                            ? 'border-red-200 text-red-600 hover:bg-red-50'
                            : this.variant === 'primary'
                              ? 'border-brand bg-brand text-white hover:border-[#3d4450] hover:bg-[#3d4450]'
                              : 'border-line text-ink hover:bg-slate-50'}"
                        ?disabled=${this.disabled}
                        @click=${() => this.dispatchEvent(new CustomEvent('button-click', { bubbles: true, composed: true }))}
                    >
                        ${this.label}
                    </button>`;
                }
            }
            customElements.define('ui-button', UiButton);
            class UiSelect extends LitElement {
                static properties = {
                    options: { attribute: false },
                    value: { type: String },
                    label: { type: String },
                    disabled: { type: Boolean },
                    expanded: { state: true },
                    activeIndex: { state: true }
                };
                static nextId = 0;
                constructor() {
                    super();
                    this.options = [];
                    this.label = '请选择';
                    this.expanded = false;
                    this.activeIndex = -1;
                    this.listId = 'select-options-' + ++UiSelect.nextId;
                    this.closeOnViewportChange = event => {
                        if (!this.querySelector('[role=listbox]')?.contains(event.target)) this.close();
                    };
                }
                createRenderRoot() {
                    return this;
                }
                connectedCallback() {
                    super.connectedCallback();
                    window.addEventListener('resize', this.closeOnViewportChange);
                    window.addEventListener('scroll', this.closeOnViewportChange, true);
                }
                disconnectedCallback() {
                    window.removeEventListener('resize', this.closeOnViewportChange);
                    window.removeEventListener('scroll', this.closeOnViewportChange, true);
                    this.close();
                    super.disconnectedCallback();
                }
                updated() {
                    if (this.disabled) this.close();
                }
                close() {
                    const list = this.querySelector('[role=listbox]');
                    if (list?.matches(':popover-open')) list.hidePopover();
                    this.expanded = false;
                }
                async open(index) {
                    if (this.disabled || !this.options.length) return;
                    this.activeIndex =
                        index ??
                        Math.max(
                            0,
                            this.options.findIndex(([value]) => value === this.value)
                        );
                    await this.updateComplete;
                    if (!this.isConnected || this.disabled) return;
                    const list = this.querySelector('[role=listbox]');
                    const anchor = this.querySelector('[role=combobox]').getBoundingClientRect();
                    const below = innerHeight - anchor.bottom - 12;
                    const above = anchor.top - 12;
                    const upwards = below < Math.min(240, this.options.length * 36 + 10) && above > below;
                    list.style.width = Math.min(Math.max(anchor.width, 140), innerWidth - 24) + 'px';
                    list.style.maxHeight = Math.max(0, Math.min(240, upwards ? above : below)) + 'px';
                    list.showPopover();
                    const bounds = list.getBoundingClientRect();
                    list.style.left = Math.max(12, Math.min(anchor.left, innerWidth - bounds.width - 12)) + 'px';
                    list.style.top = (upwards ? anchor.top - bounds.height - 6 : anchor.bottom + 6) + 'px';
                    this.expanded = true;
                    this.scrollActive();
                }
                async scrollActive() {
                    await this.updateComplete;
                    this.querySelector('[data-active=true]')?.scrollIntoView({ block: 'nearest' });
                }
                choose(index) {
                    if (this.disabled || !this.options[index]) return;
                    const [value] = this.options[index];
                    const changed = value !== this.value;
                    this.value = value;
                    this.close();
                    this.querySelector('[role=combobox]').focus();
                    if (changed) this.dispatchEvent(new CustomEvent('select-change', { detail: { value }, bubbles: true, composed: true }));
                }
                onKeydown(event) {
                    if (this.disabled || !this.options.length) return;
                    const { key } = event;
                    if (key === 'Tab' || key === 'Escape') {
                        this.close();
                        if (key === 'Escape') event.preventDefault();
                        return;
                    }
                    if (['ArrowDown', 'ArrowUp', 'Home', 'End', 'Enter', ' '].includes(key)) {
                        event.preventDefault();
                        if (!this.expanded) {
                            this.open(key === 'Home' ? 0 : key === 'End' ? this.options.length - 1 : undefined);
                        } else if (key === 'Enter' || key === ' ') this.choose(this.activeIndex);
                        else {
                            this.activeIndex =
                                key === 'Home'
                                    ? 0
                                    : key === 'End'
                                      ? this.options.length - 1
                                      : (this.activeIndex + (key === 'ArrowDown' ? 1 : -1) + this.options.length) % this.options.length;
                            this.scrollActive();
                        }
                    } else if (key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
                        const now = dayjs().valueOf();
                        this.searchText = (now - (this.searchTime || 0) < 700 ? this.searchText : '') + key.toLowerCase();
                        this.searchTime = now;
                        const index = this.options.findIndex(([, label]) => label.toLowerCase().startsWith(this.searchText));
                        if (index >= 0) {
                            event.preventDefault();
                            this.open(index);
                        }
                    }
                }
                render() {
                    const selected = this.options.find(([value]) => value === this.value);
                    return html`<button
                            type="button"
                            role="combobox"
                            aria-haspopup="listbox"
                            aria-label=${this.label}
                            aria-expanded=${String(this.expanded)}
                            aria-controls=${this.listId}
                            aria-activedescendant=${this.expanded ? this.listId + '-' + this.activeIndex : ''}
                            class="flex h-9 w-full min-w-32 items-center justify-between gap-3 rounded-lg border border-line bg-white px-3 text-[13px] text-ink hover:border-[#c9ced7] hover:bg-slate-50 disabled:opacity-40"
                            ?disabled=${this.disabled}
                            @click=${() => (this.expanded ? this.close() : this.open())}
                            @keydown=${this.onKeydown}
                            @blur=${this.close}
                        >
                            <span class="truncate">${selected?.[1] || this.label}</span>
                            <svg
                                class="size-3.5 shrink-0 text-muted transition-transform ${this.expanded ? 'rotate-180' : ''}"
                                viewBox="0 0 16 16"
                                fill="none"
                                aria-hidden="true"
                            >
                                <path
                                    d="m4 6 4 4 4-4"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                ></path>
                            </svg>
                        </button>
                        <div
                            id=${this.listId}
                            role="listbox"
                            aria-label=${this.label}
                            popover="auto"
                            class="fixed overflow-auto rounded-xl border border-line bg-white p-1 text-[13px] text-ink shadow-[0_8px_24px_#1018281a] [scrollbar-width:thin]"
                            style="inset:auto;margin:0;box-sizing:border-box"
                            @toggle=${event => {
                                this.expanded = event.newState === 'open';
                            }}
                            @mousedown=${event => event.preventDefault()}
                        >
                            ${this.options.map(
                                ([value, label], index) =>
                                    html`<div
                                        id=${this.listId + '-' + index}
                                        role="option"
                                        aria-selected=${String(value === this.value)}
                                        data-active=${String(index === this.activeIndex)}
                                        class="flex min-h-9 cursor-pointer items-center justify-between gap-3 rounded-lg px-2.5 py-2 hover:bg-slate-100 data-[active=true]:bg-slate-100 aria-selected:font-medium"
                                        @click=${() => this.choose(index)}
                                    >
                                        <span>${label}</span>
                                        <svg
                                            class="size-3.5 shrink-0 ${value === this.value ? '' : 'invisible'}"
                                            viewBox="0 0 16 16"
                                            fill="none"
                                            aria-hidden="true"
                                        >
                                            <path
                                                d="m3.5 8 3 3 6-6"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                            ></path>
                                        </svg>
                                    </div>`
                            )}
                        </div>`;
                }
            }
            customElements.define('ui-select', UiSelect);
            class UiDatePicker extends LitElement {
                static properties = { value: { type: String }, disabled: { type: Boolean }, label: { type: String } };
                static nextId = 0;
                constructor() {
                    super();
                    this.value = '';
                    this.label = '日期时间';
                    this.inputId = 'date-picker-' + ++UiDatePicker.nextId;
                }
                createRenderRoot() {
                    return this;
                }
                connectedCallback() {
                    super.connectedCallback();
                    this.updateComplete.then(() => {
                        if (!this.isConnected || this.picker) return;
                        this.picker = flatpickr(this.querySelector('input'), {
                            locale: Mandarin,
                            enableTime: true,
                            enableSeconds: true,
                            time_24hr: true,
                            minuteIncrement: 1,
                            disableMobile: true,

                                                @button-click=${() => this.openDetail(this.detailId)}
                                            ></ui-button>
                                        </div>`
                                      : html`<pre
                                            class="min-h-32 min-w-0 overflow-auto whitespace-pre-wrap break-words bg-slate-50 p-5 font-mono text-xs leading-5"
                                            tabindex="0"
                                            aria-label="日志正文"
                                        >
${this.formatBody(this.detail?.[this.detailTab])}</pre
                                        >`}
                            </div>
                        </dialog>
                    </div>`;
                }
            }
            customElements.define('logs-panel', LogsPanel);

            class AccountConsole extends LitElement {
                static properties = {
                    pageSize: { state: true },
                    panel: { state: true },
                    accounts: { state: true },
                    page: { state: true },
                    total: { state: true },
                    pages: { state: true },
                    status: { state: true },
                    loading: { state: true },
                    workingEmail: { state: true },
                    error: { state: true },
                    dialog: { state: true },
                    source: { state: true },
                    importing: { state: true },
                    authenticated: { state: true },
                    dashboardPassword: { state: true },
                    loginError: { state: true },
                    loggingIn: { state: true }
                };
                constructor() {
                    super();
                    Object.assign(this, {
                        panel: 'accounts',
                        pageSize: 24,
                        accounts: [],
                        page: 1,
                        total: 0,
                        pages: 0,
                        status: 'all',
                        loading: false,
                        workingEmail: '',
                        error: '',
                        dialog: false,
                        source: '',
                        importing: false,
                        authenticated: false,
                        dashboardPassword: '',
                        apiKey: '',
                        loginError: '',
                        loggingIn: false
                    });
                    this.handlePageShow = event => {
                        if (event.persisted) this.lockConsole();
                    };
                    this.handlePageHide = () => this.lockConsole();
                }
                createRenderRoot() {
                    return this;
                }
                connectedCallback() {
                    super.connectedCallback();
                    window.addEventListener('pageshow', this.handlePageShow);
                    window.addEventListener('pagehide', this.handlePageHide);
                    // 列表 60s 静默轮询:跟进冷却倒计时与账号状态变化,
                    // 操作中/弹窗打开时跳过,避免覆盖用户正在看的内容。
                    this.pollTimer = setInterval(() => {
                        if (!this.authenticated || this.panel !== 'accounts' || this.workingEmail || this.dialog) return;
                        this.load(true);
                    }, 60000);
                }
                disconnectedCallback() {
                    super.disconnectedCallback();
                    clearInterval(this.pollTimer);
                    window.removeEventListener('pageshow', this.handlePageShow);
                    window.removeEventListener('pagehide', this.handlePageHide);
                    this.lockConsole();
                }
                updated() {
                    const dialog = this.querySelector('#dashboard-login');
                    if (dialog && !dialog.open) {
                        dialog.showModal();
                        dialog.querySelector('input').focus();
                    }
                }
                lockConsole(error = '') {
                    this.authenticated = false;
                    this.dashboardPassword = '';
                    this.apiKey = '';
                    this.loginAttempt = null;
                    this.loggingIn = false;
                    this.querySelector('logs-panel')?.closeDetail();
                    this.querySelector('ui-date-picker')?.picker?.close();
                    this.querySelectorAll('ui-tooltip').forEach(tooltip => tooltip.hide());
                    this.loginError = error;
                    this.accounts = [];
                    this.total = 0;
                    this.pages = 0;
                    this.panel = 'accounts';
                    this.dialog = false;
                    this.source = '';
                }
                async login(event) {
                    event.preventDefault();
                    if (this.loggingIn) return;
                    const attempt = (this.loginAttempt = {});
                    this.loggingIn = true;
                    this.loginError = '';
                    try {
                        const response = await fetch('/v1/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ dashboard_password: this.dashboardPassword }),
                            cache: 'no-store'
                        });
                        const result = await response.json().catch(() => ({}));
                        if (this.loginAttempt !== attempt) return;
                        if (!response.ok || result.code >= 400)
                            throw new Error(result.message || '登录失败，请稍后重试。');
                        if (!result.data || (result.data.api_key !== null && typeof result.data.api_key !== 'string'))
                            throw new Error('登录响应无效，请重试。');
                        this.apiKey = result.data.api_key || '';
                        this.dashboardPassword = '';
                        this.authenticated = true;
                        await this.updateComplete;
                        await this.load();
                    } catch (error) {
                        if (this.loginAttempt === attempt) this.loginError = error.message || '登录失败，请检查网络后重试。';
                    } finally {
                        if (this.loginAttempt === attempt) {
                            this.loggingIn = false;
                            if (!this.authenticated) {
                                await this.updateComplete;
                                const input = this.querySelector('#dashboard-password');
                                input?.focus();
                                input?.select();
                            }
                        }
                    }
                }
                async request(path, body, resource = 'accounts') {
                    if (!this.authenticated) throw new Error('请先输入控制台密码登录。');
                    const response = await fetch('/v1/' + resource + '/' + path, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...(this.apiKey ? { Authorization: 'Bearer ' + this.apiKey } : {}) },
                        body: JSON.stringify(body)
                    });
                    const result = await response.json().catch(() => ({}));
                    if (response.status === 401) {
                        this.lockConsole('登录已失效，请重新输入控制台密码。');
                        throw new Error('登录已失效，请重新输入控制台密码。');
                    }
                    if (!response.ok || result.code >= 400) throw new Error(result.message || '请求失败 (' + response.status + ')');
                    return result.data;
                }
                async load(silent = false) {
                    if (!this.authenticated) return;
                    if (!silent) {
                        this.loading = true;
                        this.error = '';
                    }
                    try {
                        const data = await this.request('list', { page: this.page, page_size: this.pageSize, status: this.status });
                        if (!this.authenticated) return;
                        this.accounts = data.items || [];
                        this.total = data.total || 0;
                        this.pages = data.total_pages || 0;
                        if (this.pages && this.page > this.pages) {
                            this.page = this.pages;
                            await this.load();
                        }
                    } catch (e) {
                        // 静默轮询失败不打扰当前视图,只记 console。
                        if (silent) console.warn('后台刷新失败:', e);
                        else {
                            this.error = e.message || '加载账号失败';
                            message(this.error);
                        }
                    } finally {
                        this.loading = false;
                    }
                }
                async importAccounts() {
                    let records;
                    try {
                        records = JSON.parse(this.source.trim());
                        if (!Array.isArray(records)) records = [records];
                        if (
                            !records.length ||
                            records.some(
                                x =>
                                    !x ||
                                    typeof x !== 'object' ||
                                    Array.isArray(x) ||
                                    typeof x.user?.email !== 'string' ||
                                    typeof x.access_token !== 'string' ||
                                    !x.access_token
                            )
                        )
                            throw new Error('每个账号都需要包含 user.email 和 access_token。');
                    } catch (e) {
                        message(e instanceof SyntaxError ? 'JSON 格式无效，请检查后重试。' : e.message);
                        return;
                    }
                    this.importing = true;
                    try {
                        const data = await this.request(
                            'create',
                            records.length === 1 && !this.source.trim().startsWith('[') ? records[0] : records
                        );
                        const results = data.results || [data.result];
                        message(
                            '导入完成：新增 ' +
                                results.filter(x => x === 'inserted').length +
                                '，更新 ' +
                                results.filter(x => x === 'updated').length +
                                '，未变化 ' +
                                results.filter(x => x === 'unchanged').length,
                            'success'
                        );
                        this.dialog = false;
                        this.source = '';
                        this.status = 'all';
                        this.page = 1;
                        await this.load();
                    } catch (e) {
                        message(e.message || '导入失败');
                    } finally {
                        this.importing = false;
                    }
                }
                chooseStatus(e) {
                    this.status = e.detail.value;
                    this.page = 1;
                    this.load();
                }
                async accountAction(e) {
                    const { action, email } = e.detail;
                    if (this.workingEmail) return;
                    if (action === 'delete' && !confirm('确定删除账号 ' + email + ' 吗？')) return;
                    this.workingEmail = email;
                    try {
                        const account = await this.request(action, { email });
                        const failed = action === 'restore' && !account.available;
                        message(
                            action === 'delete'
                                ? '账号已删除'
                                : action === 'restore'
                                  ? failed
                                      ? account.unavailable_reason || '账号校验失败，仍不可用'
                                      : '账号已恢复并完成校验'
                                  : '账号额度已刷新',
                            failed ? 'error' : 'success'
                        );
                        await this.load();
                    } catch (error) {
                        message(error.message || '操作失败');
                        if (action === 'refresh' || action === 'restore') await this.load(true);
                    } finally {
                        this.workingEmail = '';
                    }
                }
                async switchPanel(panel) {
                    this.querySelector('ui-date-picker')?.picker?.close();
                    this.panel = panel;
                    await this.updateComplete;
                    if (panel === 'logs') this.querySelector('logs-panel').load();
                }
                render() {
                    if (!this.authenticated)
                        return html`<dialog
                            id="dashboard-login"
                            aria-labelledby="login-title"
                            aria-describedby="login-description"
                            aria-modal="true"
                            class="fixed inset-0 m-auto w-[calc(100%-32px)] max-w-sm rounded-xl border border-line bg-white p-6 text-ink shadow-[0_24px_80px_#10182826] backdrop:bg-slate-950/40 backdrop:backdrop-blur-[2px]"
                            @cancel=${event => event.preventDefault()}
                        >
                            <form @submit=${this.login}>
                                <h2 id="login-title" class="text-base font-semibold">登录管理控制台</h2>
                                <p id="login-description" class="mt-2 text-xs leading-5 text-muted">请输入控制台密码以继续。</p>
                                <label for="dashboard-password" class="mt-5 block text-xs font-medium">控制台密码</label>
                                <input
                                    id="dashboard-password"
                                    name="dashboard_password"
                                    type="password"
                                    autocomplete="current-password"
                                    autofocus
                                    required
                                    aria-invalid=${this.loginError ? 'true' : 'false'}
                                    aria-describedby="login-error"
                                    class="mt-2 w-full rounded-lg border border-line bg-slate-50 px-3 py-2 text-sm outline-none focus:border-brand focus:bg-white max-[700px]:text-base"
                                    .value=${this.dashboardPassword}
                                    ?disabled=${this.loggingIn}
                                    @input=${event => {
                                        this.dashboardPassword = event.target.value;
                                        this.loginError = '';
                                    }}
                                />
                                <p id="login-error" role="alert" class="mt-2 min-h-5 text-xs leading-5 text-red-600">${this.loginError}</p>
                                <button
                                    type="submit"
                                    class="mt-3 inline-flex min-h-9 w-full items-center justify-center rounded-lg bg-brand px-3.5 py-2 text-[13px] font-medium text-white disabled:opacity-50"
                                    ?disabled=${this.loggingIn}
                                >
                                    ${this.loggingIn ? '验证中…' : '进入控制台'}
                                </button>
                            </form>
                        </dialog>`;
                    return html` <main class="flex h-full flex-col overflow-hidden">
                        <header class="border-b border-line bg-white shrink-0">
                            <div
                                class="mx-auto grid w-full grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] min-h-14 items-center gap-3 px-8 py-2 max-[700px]:grid-cols-1 max-[700px]:px-5"
                            >
                                <div class="flex items-center gap-3 text-[15px] font-[650] tracking-[-.3px]">
                                    <span
                                        class="grid size-8 place-items-center rounded-lg bg-blue-600 text-[19px] text-white"
                                        aria-hidden="true"
                                        >R</span
                                    ><span>Raycast<span class="text-muted">2API</span></span>
                                </div>
                                <nav class="flex justify-self-center gap-1 rounded-lg bg-slate-100 p-1" aria-label="面板切换">
                                    ${[
                                        ['accounts', '账号面板'],
                                        ['logs', '日志面板']
                                    ].map(
                                        ([value, label]) =>
                                            html`<button
                                                class="rounded-md px-3 py-1.5 text-xs ${this.panel === value
                                                    ? 'bg-white text-ink shadow-sm'
                                                    : 'text-muted hover:bg-white/60'}"
                                                aria-pressed=${this.panel === value ? 'true' : 'false'}
                                                @click=${() => this.switchPanel(value)}
                                            >
                                                ${label}
                                            </button>`
                                    )}
                                </nav>
                            </div>
                        </header>
                        <div
                            class="min-h-0 flex-1 flex-col ${this.panel === 'accounts' ? 'flex' : 'hidden'}"
                            ?inert=${this.panel !== 'accounts'}
                        >
                            <section class="min-h-0 flex-1 flex flex-col pt-4" aria-label="账号列表">
                                <div class="mx-auto min-h-0 flex-1 flex flex-col w-full">
                                    <div
                                        class="mb-4 shrink-0 px-8 max-[700px]:px-5 flex items-center justify-between gap-3 max-[700px]:flex-wrap"
                                    >
                                        <ui-select
                                            class="flex items-center gap-3"
                                            label="筛选账号状态"
                                            .options=${filters}
                                            .value=${this.status}
                                            @select-change=${this.chooseStatus}
                                        ></ui-select>
                                        <div class="flex items-center gap-2">
                                            <ui-button
                                                class="inline-flex"
                                                label=${this.loading ? '刷新中…' : '刷新列表'}
                                                .disabled=${this.loading}
                                                @button-click=${() => this.load()}
                                            ></ui-button>
                                            <ui-button
                                                class="inline-flex"
                                                label="＋ 导入账号"
                                                variant="primary"
                                                @button-click=${() => {
                                                    this.dialog = true;
                                                }}
                                            ></ui-button>
                                        </div>
                                    </div>
                                    <div
                                        class="[scrollbar-width:thin] [scrollbar-color:#d9dce5_transparent] [&::-webkit-scrollbar]:w-[7px] [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-[#d9dce5] min-h-0 flex-1 overflow-y-auto px-8 max-[700px]:px-5"
                                        @scroll=${() => this.querySelectorAll('ui-tooltip').forEach(tooltip => tooltip.hide())}
                                    >
                                        ${this.loading && !this.accounts.length
                                            ? html`<div
                                                  class="grid grid-cols-4 items-stretch gap-3 max-[1200px]:grid-cols-3 max-[900px]:grid-cols-2 max-[700px]:grid-cols-1"
                                              >
                                                  ${[1, 2, 3].map(
                                                      () =>
                                                          html`<div
                                                              class="h-52 animate-pulse rounded-xl border border-line bg-white"
                                                          ></div>`
                                                  )}
                                              </div>`
                                            : this.accounts.length
                                              ? html`
                                                    <div
                                                        class="grid grid-cols-4 items-stretch gap-3 max-[1200px]:grid-cols-3 max-[900px]:grid-cols-2 max-[700px]:grid-cols-1"
                                                        @account-action=${this.accountAction}
                                                    >
                                                        ${this.accounts.map(
                                                            account =>
                                                                html`<account-card
                                                                    class="block min-w-0"
                                                                    .account=${account}
                                                                    .busy=${this.workingEmail === account.email}
                                                                ></account-card>`
                                                        )}
                                                    </div>
                                                `
                                              : html`<div
                                                    class="min-h-[200px] border-0 bg-transparent flex flex-col items-center justify-center px-6 text-center"
                                                >
                                                    <div
                                                        class="size-14 rounded-xl border border-line bg-white text-[#7b8491] grid place-items-center text-xl"
                                                    >
                                                        ＋
                                                    </div>
                                                    <h3 class="mt-4 text-sm font-semibold text-ink">
                                                        ${this.status === 'all' ? '添加你的第一个账号' : '没有符合条件的账号'}
                                                    </h3>
                                                    <p class="mt-2 text-[13px] text-muted">导入账号 JSON，开始管理账号状态与额度。</p>
                                                    ${this.status === 'all'
                                                        ? html`<button
                                                              class="mt-4 rounded-lg bg-brand px-4 py-2 text-xs font-medium text-white"
                                                              @click=${() => (this.dialog = true)}
                                                          >
                                                              导入账号
                                                          </button>`
                                                        : ''}
                                                </div>`}
                                    </div>
                                    <footer class="shrink-0 px-8 max-[700px]:px-5">
                                        <div
                                            class="flex items-center justify-between gap-4 py-4 max-[700px]:flex-wrap max-[700px]:[&>div]:ml-auto"
                                        >
                                            <p class="truncate text-xs text-muted">
                                                共 ${this.total} 个账号<span class="mx-2 text-slate-300">·</span>${this.total
                                                    ? '第 ' + this.page + ' / ' + this.pages + ' 页'
                                                    : '暂无账号'}
                                            </p>
                                            <div class="flex shrink-0 items-center gap-2">
                                                <ui-select
                                                    class="block"
                                                    label="账号每页条数"
                                                    .options=${[12, 24, 48, 96].map(size => [String(size), '每页 ' + size + ' 条'])}
                                                    .value=${String(this.pageSize)}
                                                    .disabled=${this.loading}
                                                    @select-change=${e => {
                                                        this.pageSize = Number(e.detail.value);
                                                        this.page = 1;
                                                        this.load();
                                                    }}
                                                ></ui-select>
                                                <ui-button
                                                    class="inline-flex"
                                                    label="上一页"
                                                    .disabled=${this.page <= 1 || this.loading}
                                                    @button-click=${() => {
                                                        this.page--;
                                                        this.load();
                                                    }}
                                                ></ui-button
                                                ><span class="min-w-16 text-center text-xs font-medium"
                                                    >${this.page} / ${this.pages || 1}</span
                                                ><ui-button
                                                    class="inline-flex"
                                                    label="下一页"
                                                    .disabled=${this.page >= this.pages || this.loading}
                                                    @button-click=${() => {
                                                        this.page++;
                                                        this.load();
                                                    }}
                                                ></ui-button>
                                            </div>
                                        </div>
                                    </footer>
                                </div>
                            </section>
                        </div>
                        <logs-panel
                            class="min-h-0 flex-1 overflow-hidden ${this.panel === 'logs' ? 'block' : 'hidden'}"
                            ?inert=${this.panel !== 'logs'}
                            .request=${(path, body) => this.request(path, body, 'logs')}
                        ></logs-panel>
                        ${this.dialog
                            ? html`<div
                                  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-[2px]"
                                  @click=${e => {
                                      if (e.target === e.currentTarget) this.dialog = false;
                                  }}
                              >
                                  <section
                                      role="dialog"
                                      aria-modal="true"
                                      aria-labelledby="import-title"
                                      class="max-h-[calc(100dvh-32px)] overflow-y-auto rounded-xl border border-line p-0 shadow-[0_24px_80px_#10182826] [&_input]:rounded-lg [&_textarea]:rounded-lg max-[700px]:[&_input]:text-base max-[700px]:[&_textarea]:text-base w-full max-w-xl bg-white"
                                  >
                                      <div class="flex items-center justify-between gap-4 border-b border-line px-6 py-5 max-[700px]:p-4">
                                          <h2 id="import-title" class="text-base font-semibold">导入账号</h2>
                                          <button
                                              class="grid size-8 place-items-center rounded-lg text-muted hover:bg-gray-100"
                                              aria-label="关闭导入窗口"
                                              @click=${() => (this.dialog = false)}
                                          >
                                              ×
                                          </button>
                                      </div>
                                      <div class="p-6 max-[700px]:p-4">
                                          <p class="mt-1 text-xs leading-5 text-muted">
                                              粘贴单个账号 JSON 或账号 JSON 数组，按 user.email 更新账号。
                                          </p>
                                          <label for="account-json" class="mt-5 block text-xs font-medium">账号 JSON</label
                                          ><textarea
                                              id="account-json"
                                              class="mt-2 h-64 w-full resize-y rounded-lg border border-line bg-slate-50 p-4 font-mono text-xs leading-5 outline-none focus:border-brand focus:bg-white"
                                              .value=${this.source}
                                              @input=${e => (this.source = e.target.value)}
                                              placeholder='[{"tag":"主账号","user":{"email":"name@example.com"},"access_token":"rca_...","refresh_token":"..."}]'
                                          ></textarea>
                                      </div>
                                      <div class="flex justify-end gap-2 border-t border-line bg-[#fafbfc] px-6 py-4 max-[700px]:p-4">
                                          <button
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px]"
                                              @click=${() => (this.dialog = false)}
                                          >
                                              取消</button
                                          ><button
                                              class="inline-flex min-h-9 items-center justify-center rounded-lg border border-line px-3.5 py-2 text-[13px] bg-brand text-white disabled:opacity-50"
                                              ?disabled=${this.importing}
                                              @click=${this.importAccounts}
                                          >
                                              ${this.importing ? '导入中…' : '确定导入'}
                                          </button>
                                      </div>
                                  </section>
                              </div>`
                            : ''}
                    </main>`;
                }
            }
            customElements.define('account-console', AccountConsole);
        </script>
    </body>
</html>
