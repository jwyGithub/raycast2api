<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>raycast2api · 开发控制台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --fg: #e6e9ef; --muted: #9aa4b2; --accent: #6ea8fe; --accent-2: #7ee787;
    --danger: #ff7b72; --warn: #e3b341; --chip: #262b36;
    --get: #7ee787; --post: #6ea8fe; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --j-key:#7ee787; --j-str:#a5d6ff; --j-num:#f2cc60; --j-bool:#ff7b72; --j-null:#9aa4b2;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f7f9; --panel:#fff; --panel-2:#f0f2f5; --border:#dfe3ea;
      --fg:#1f2430; --muted:#5c6675; --accent:#1a66ff; --accent-2:#1a7f37;
      --danger:#cf222e; --warn:#9a6700; --chip:#eef1f6;
      --get:#1a7f37; --post:#1a66ff;
      --j-key:#116329; --j-str:#0a3069; --j-num:#953800; --j-bool:#cf222e; --j-null:#6e7781;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  header h1 .dim { color: var(--muted); font-weight: 400; }
  .tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 9px; }
  .tabs button {
    border: 0; background: transparent; color: var(--muted); padding: 6px 14px;
    border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .tabs button.active { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  .base { display: flex; align-items: center; gap: 6px; }
  .base label { color: var(--muted); font-size: 12px; }
  input, select, textarea, button { font-family: inherit; color: var(--fg); }
  .base input {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 9px; border-radius: 7px; width: 230px; font-size: 12px; font-family: var(--mono);
  }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 0 rgba(126,231,135,.5); }
  .dot.on { background: var(--accent-2); animation: pulse 2s infinite; }
  .dot.err { background: var(--danger); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(126,231,135,.5)} 70%{box-shadow:0 0 0 7px rgba(126,231,135,0)} 100%{box-shadow:0 0 0 0 rgba(126,231,135,0)} }

  main { flex: 1; min-height: 0; display: none; }
  main.active { display: flex; }

  /* ---------- Monitor ---------- */
  #monitor { flex-direction: column; }
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  .toolbar input.filter {
    flex: 1; min-width: 120px; background: var(--panel-2); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 7px; font-size: 13px;
  }
  .btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.toggle.on { background: var(--warn); border-color: var(--warn); color: #1b1b1b; }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  .list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); }
  .req {
    padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  }
  .req:hover { background: var(--panel); }
  .req.sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .req .r1 { display: flex; align-items: center; gap: 7px; }
  .method { font: 700 10.5px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--chip); color: var(--post); letter-spacing: .3px; }
  .method.get { color: var(--get); }
  .path { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .req .r2 { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
  .tags { display: flex; gap: 4px; }
  .tag { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .tag.in { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tag.up { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); }
  .model { font-family: var(--mono); }

  .detail { overflow-y: auto; padding: 0; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .section { border-bottom: 1px solid var(--border); }
  .section > h3 {
    margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  .section h3 .badge { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: var(--chip); color: var(--fg); font-weight: 600; letter-spacing: 0; }
  .section h3 .copy { margin-left: auto; }
  .copy { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .copy:hover { color: var(--fg); border-color: var(--accent); }
  pre.code { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  table.kv { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  table.kv td { padding: 5px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.kv td.k { color: var(--j-key); white-space: nowrap; width: 1%; }
  table.kv td.v { color: var(--fg); word-break: break-all; }
  .meta-line { padding: 8px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta-line b { color: var(--fg); font-weight: 600; }

  /* JSON syntax */
  .j-key{color:var(--j-key)} .j-str{color:var(--j-str)} .j-num{color:var(--j-num)} .j-bool{color:var(--j-bool)} .j-null{color:var(--j-null)}

  /* ---------- Tester ---------- */
  #tester { padding: 0; }
  .tester-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0; width: 100%; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane.left { border-right: 1px solid var(--border); }
  .pane h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .form { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .field label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .field input, .field select {
    background: var(--panel-2); border: 1px solid var(--border); padding: 7px 9px; border-radius: 7px; font-size: 13px;
  }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg); }
  .check input { width: 16px; height: 16px; }
  .body-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 160px; }
  .body-head { display: flex; align-items: center; gap: 8px; }
  .body-head label { font-size: 11px; color: var(--muted); font-weight: 600; }
  textarea#reqbody {
    flex: 1; min-height: 220px; resize: vertical; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
  }
  .actions { display: flex; gap: 8px; align-items: center; }
  .resp-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .resp-status { font-family: var(--mono); font-weight: 700; }
  .resp-status.ok { color: var(--accent-2); } .resp-status.bad { color: var(--danger); }
  .resp-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .subtabs { display: flex; gap: 4px; margin-left: auto; }
  .subtabs button { border:1px solid var(--border); background: var(--panel-2); color: var(--muted); border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer; font-weight:600; }
  .subtabs button.active { color: var(--fg); border-color: var(--accent); }
  .resp-body { flex: 1; overflow: auto; }
  .resp-body pre { margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .hint { color: var(--muted); font-size: 11.5px; padding: 0 14px 12px; }
  .err-text { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>raycast2api <span class="dim">开发控制台</span></h1>
  <div class="tabs">
    <button id="tab-monitor" class="active" onclick="showTab('monitor')">日志监控</button>
    <button id="tab-tester" onclick="showTab('tester')">网关测试</button>
  </div>
  <div class="spacer"></div>
  <div class="base">
    <label>网关地址</label>
    <input id="baseUrl" spellcheck="false" placeholder="http://localhost:8787" />
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">未连接</span></div>
</header>

<!-- ================= MONITOR ================= -->
<main id="monitor" class="active">
  <div class="toolbar">
    <button id="connectBtn" class="btn primary" onclick="toggleConnect()">连接</button>
    <button id="pauseBtn" class="btn toggle" onclick="togglePause()">暂停</button>
    <button class="btn" onclick="clearAll()">清空</button>
    <label class="check" style="margin-left:2px"><input type="checkbox" id="autoscroll" checked /> 自动选中最新</label>
    <input class="filter" id="filter" placeholder="过滤：路径 / 模型 / 方法 / 请求体关键字" oninput="renderList()" />
    <span class="count" id="count">0 条请求</span>
  </div>
  <div class="split">
    <div class="list" id="reqList"></div>
    <div class="detail" id="detail"><div class="empty">选择左侧的一条请求查看详情。<br/>发起请求后（含“网关测试”页），入站与上游数据会实时出现在这里。</div></div>
  </div>
</main>

<!-- ================= TESTER ================= -->
<main id="tester">
  <div class="tester-grid">
    <div class="pane left">
      <h2>请求</h2>
      <div class="form">
        <div class="row">
          <div class="field" style="flex:2">
            <label>端点</label>
            <select id="endpoint" onchange="onEndpointChange()">
              <option value="/v1/chat/completions">/v1/chat/completions（OpenAI Chat）</option>
              <option value="/v1/messages">/v1/messages（Anthropic Messages）</option>
              <option value="/v1/responses">/v1/responses（OpenAI Responses）</option>
            </select>
          </div>
          <div class="field">
            <label>模型 (model)</label>
            <input id="model" spellcheck="false" value="openai-gpt-4o-mini" oninput="syncModelIntoBody()" />
          </div>
        </div>
        <div class="row">
          <div class="field" style="flex:2">
            <label>API Key（可选，作为 Authorization: Bearer 发送）</label>
            <input id="apiKey" spellcheck="false" placeholder="留空表示不带鉴权头" />
          </div>
          <label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="stream" checked onchange="syncStreamIntoBody()" /> 流式 (stream)</label>
        </div>
        <div class="body-wrap">
          <div class="body-head">
            <label>请求体 (JSON)</label>
            <button class="copy" onclick="formatBody()">格式化</button>
            <button class="copy" onclick="resetBody()">重置示例</button>
          </div>
          <textarea id="reqbody" spellcheck="false"></textarea>
        </div>
        <div class="actions">
          <button id="sendBtn" class="btn primary" onclick="sendTest()">发送请求</button>
          <button id="stopBtn" class="btn" onclick="abortTest()" disabled>停止</button>
          <span class="count" id="reqInfo"></span>
        </div>
      </div>
    </div>
    <div class="pane">
      <h2>响应</h2>
      <div class="resp-head">
        <span class="resp-status" id="respStatus">—</span>
        <span class="resp-time" id="respTime"></span>
        <div class="subtabs">
          <button id="sub-pretty" class="active" onclick="showRespTab('pretty')">文本 / JSON</button>
          <button id="sub-raw" onclick="showRespTab('raw')">原始流</button>
        </div>
      </div>
      <div class="resp-body">
        <pre id="respPretty"></pre>
        <pre id="respRaw" style="display:none"></pre>
      </div>
      <div class="hint">提示：发送后可切到“日志监控”查看该请求的入站头/体与转发上游的请求体/参数（签名、时间戳等）。</div>
    </div>
  </div>
</main>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * Shared helpers
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const LS = { base: "r2a_base" };

function defaultBase() {
  if (location.protocol === "http:" || location.protocol === "https:") return location.origin;
  return "http://localhost:8787";
}
function getBase() { return ($("baseUrl").value || "").trim().replace(/\/+$/, "") || defaultBase(); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Pretty-print + syntax-highlight a JSON value (or show a raw string).
function highlightJson(value) {
  let text;
  if (typeof value === "string") {
    try { text = JSON.stringify(JSON.parse(value), null, 2); }
    catch { return escapeHtml(value); }
  } else {
    try { text = JSON.stringify(value, null, 2); } catch { return escapeHtml(String(value)); }
  }
  const re = /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  return escapeHtml(text).replace(/&quot;/g, '"').replace(re, (m) => {
    let cls = "j-num";
    if (/^"/.test(m)) cls = /:$/.test(m) ? "j-key" : "j-str";
    else if (/true|false/.test(m)) cls = "j-bool";
    else if (/null/.test(m)) cls = "j-null";
    // Re-escape the matched token's quotes for safe HTML.
    const safe = m.replace(/[<>&]/g, (c) => ({ "<":"&lt;",">":"&gt;","&":"&amp;" }[c]));
    return `<span class="${cls}">${safe}</span>`;
  });
}

function fmtTime(ms) {
  const d = new Date(ms);
  const p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
}
function copyText(t) { navigator.clipboard && navigator.clipboard.writeText(t); }

/* ------------------------------------------------------------------ *
 * Tab switching
 * ------------------------------------------------------------------ */
function showTab(name) {
  for (const t of ["monitor", "tester"]) {
    $(t).classList.toggle("active", t === name);
    $("tab-" + t).classList.toggle("active", t === name);
  }
}

/* ------------------------------------------------------------------ *
 * Monitor: SSE + request list
 * ------------------------------------------------------------------ */
const M = { es: null, recs: new Map(), order: [], sel: null, paused: false, MAX: 500 };

function setStatus(kind, text) {
  const dot = $("dot");
  dot.className = "dot" + (kind === "on" ? " on" : kind === "err" ? " err" : "");
  $("statusText").textContent = text;
}

function toggleConnect() {
  if (M.es) { disconnect(); } else { connect(); }
}
function connect() {
  disconnect();
  const url = getBase() + "/debug/events";
  setStatus("", "连接中…");
  let es;
  try { es = new EventSource(url); }
  catch (e) { setStatus("err", "连接失败"); return; }
  M.es = es;
  $("connectBtn").textContent = "断开";
  es.onopen = () => setStatus("on", "已连接 · " + getBase());
  es.onerror = () => setStatus("err", "连接中断（自动重试中）");
  es.onmessage = (ev) => {
    if (M.paused) return;
    let data; try { data = JSON.parse(ev.data); } catch { return; }
    ingest(data);
  };
}
function disconnect() {
  if (M.es) { M.es.close(); M.es = null; }
  $("connectBtn").textContent = "连接";
  setStatus("", "未连接");
}

function ingest(ev) {
  const id = ev.id || "-";
  const key = id === "-" ? "orphan-" + (ev.ts_ms + "-" + Math.random().toString(36).slice(2, 6)) : id;
  let rec = M.recs.get(key);
  if (!rec) {
    rec = { key, id, inbound: null, upstream: null, first: ev.ts_ms || Date.now() };
    M.recs.set(key, rec);
    M.order.push(key);
    // Cap memory: drop oldest.
    while (M.order.length > M.MAX) {
      const old = M.order.shift();
      M.recs.delete(old);
      if (M.sel === old) M.sel = null;
    }
  }
  if (ev.kind === "inbound") rec.inbound = ev;
  else if (ev.kind === "upstream") rec.upstream = ev;

  const autoselect = $("autoscroll").checked;
  if (autoselect && ev.kind === "inbound") M.sel = key;
  renderList();
  if (M.sel === key) renderDetail();
}

function matchesFilter(rec, q) {
  if (!q) return true;
  q = q.toLowerCase();
  const ib = rec.inbound, up = rec.upstream;
  const hay = [
    ib && ib.method, ib && ib.path,
    ib && modelOf(ib.body), up && up.url,
    ib && safeStr(ib.body), up && safeStr(up.body),
  ].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function safeStr(v) { try { return typeof v === "string" ? v : JSON.stringify(v); } catch { return ""; } }
function modelOf(body) {
  if (body && typeof body === "object" && typeof body.model === "string") return body.model;
  return "";
}

function renderList() {
  const q = $("filter").value.trim();
  const list = $("reqList");
  const ids = M.order.slice().reverse(); // newest first
  let shown = 0;
  const html = [];
  for (const key of ids) {
    const rec = M.recs.get(key);
    if (!rec || !matchesFilter(rec, q)) continue;
    shown++;
    const ib = rec.inbound;
    const method = ib ? ib.method : (rec.upstream ? "POST" : "?");
    const path = ib ? ib.path : (rec.upstream ? rec.upstream.url.replace(/^https?:\/\/[^/]+/, "") : "(等待入站)");
    const model = ib ? modelOf(ib.body) : "";
    const sel = key === M.sel ? " sel" : "";
    html.push(
      `<div class="req${sel}" onclick="select('${key}')">
        <div class="r1">
          <span class="method ${method.toLowerCase()}">${escapeHtml(method)}</span>
          <span class="path" title="${escapeHtml(path)}">${escapeHtml(path)}</span>
        </div>
        <div class="r2">
          <span>${fmtTime(rec.first)}</span>
          ${model ? `<span class="model">${escapeHtml(model)}</span>` : ""}
          <span class="spacer" style="flex:1"></span>
          <span class="tags">
            <span class="tag in" style="opacity:${rec.inbound ? 1 : .3}">入站</span>
            <span class="tag up" style="opacity:${rec.upstream ? 1 : .3}">上游</span>
          </span>
        </div>
      </div>`
    );
  }
  list.innerHTML = html.join("") || `<div class="empty">暂无请求。<br/>点“连接”后发起请求即可。</div>`;
  $("count").textContent = `${shown} / ${M.recs.size} 条请求`;
}

function select(key) { M.sel = key; renderList(); renderDetail(); }

function headerTable(pairs) {
  if (!pairs || !pairs.length) return `<div class="meta-line">（无）</div>`;
  const rows = pairs.map(([k, v]) => `<tr><td class="k">${escapeHtml(k)}</td><td class="v">${escapeHtml(v)}</td></tr>`).join("");
  return `<table class="kv">${rows}</table>`;
}
function section(title, badge, contentHtml, copyPayload) {
  const copyBtn = copyPayload != null
    ? `<button class="copy" onclick='copyText(${JSON.stringify(copyPayload)})'>复制</button>` : "";
  return `<div class="section"><h3>${escapeHtml(title)}${badge ? `<span class="badge">${escapeHtml(badge)}</span>` : ""}${copyBtn ? `<span class="copy-wrap" style="margin-left:auto">${copyBtn}</span>` : ""}</h3>${contentHtml}</div>`;
}

function renderDetail() {
  const d = $("detail");
  const rec = M.sel && M.recs.get(M.sel);
  if (!rec) { d.innerHTML = `<div class="empty">选择左侧的一条请求查看详情。</div>`; return; }
  const ib = rec.inbound, up = rec.upstream;
  const parts = [];

  // Correlation meta
  parts.push(`<div class="meta-line">关联 ID <b>${escapeHtml(rec.id)}</b> · 入站 ${ib ? fmtTime(ib.ts_ms) : "—"} · 上游 ${up ? fmtTime(up.ts_ms) : "—"}${(ib && up) ? ` · 间隔 <b>${up.ts_ms - ib.ts_ms}ms</b>` : ""}</div>`);

  // Inbound
  if (ib) {
    parts.push(section("入站请求头", `${ib.headers.length} 项`, headerTable(ib.headers), JSON.stringify(ib.headers, null, 2)));
    parts.push(section("入站请求体", ib.method + " " + ib.path, `<pre class="code">${highlightJson(ib.body)}</pre>`, typeof ib.body === "string" ? ib.body : JSON.stringify(ib.body, null, 2)));
  } else {
    parts.push(`<div class="meta-line">等待入站数据…</div>`);
  }

  // Upstream
  if (up) {
    parts.push(section("发给上游的请求参数", up.method, `<div class="meta-line"><b>${escapeHtml(up.method)}</b> ${escapeHtml(up.url)}</div>${headerTable(up.headers)}`, JSON.stringify({ method: up.method, url: up.url, headers: up.headers }, null, 2)));
    parts.push(section("发给上游的请求体", "Raycast", `<pre class="code">${highlightJson(up.body)}</pre>`, typeof up.body === "string" ? up.body : JSON.stringify(up.body, null, 2)));
  } else {
    parts.push(`<div class="meta-line">尚无上游请求（可能是非推理端点，或请求未到达上游）。</div>`);
  }

  d.innerHTML = parts.join("");
}

function togglePause() {
  M.paused = !M.paused;
  $("pauseBtn").classList.toggle("on", M.paused);
  $("pauseBtn").textContent = M.paused ? "已暂停" : "暂停";
}
function clearAll() {
  M.recs.clear(); M.order = []; M.sel = null;
  renderList(); renderDetail();
}

/* ------------------------------------------------------------------ *
 * Tester
 * ------------------------------------------------------------------ */
const SAMPLES = {
  "/v1/chat/completions": {
    model: "openai-gpt-4o-mini", stream: true,
    messages: [{ role: "user", content: "用一句话介绍你自己。" }],
  },
  "/v1/messages": {
    model: "anthropic-claude-3.5-haiku", stream: true, max_tokens: 1024,
    messages: [{ role: "user", content: "用一句话介绍你自己。" }],
  },
  "/v1/responses": {
    model: "openai-gpt-4o-mini", stream: true,
    input: "用一句话介绍你自己。",
  },
};

let ctrl = null; // AbortController for the in-flight test

function currentBody() { try { return JSON.parse($("reqbody").value); } catch { return null; } }
function writeBody(obj) { $("reqbody").value = JSON.stringify(obj, null, 2); }

function resetBody() {
  const ep = $("endpoint").value;
  const s = structuredClone(SAMPLES[ep]);
  s.model = $("model").value || s.model;
  s.stream = $("stream").checked;
  writeBody(s);
}
function onEndpointChange() {
  const ep = $("endpoint").value;
  // Keep the model, refresh to that endpoint's sample shape.
  resetBody();
}
function formatBody() {
  const b = currentBody();
  if (b) writeBody(b); else flashReqInfo("请求体不是合法 JSON", true);
}
function syncModelIntoBody() {
  const b = currentBody(); if (!b) return;
  b.model = $("model").value; writeBody(b);
}
function syncStreamIntoBody() {
  const b = currentBody(); if (!b) return;
  b.stream = $("stream").checked; writeBody(b);
}
function flashReqInfo(msg, bad) {
  const el = $("reqInfo"); el.textContent = msg; el.className = "count" + (bad ? " err-text" : "");
}

function showRespTab(name) {
  $("respPretty").style.display = name === "pretty" ? "" : "none";
  $("respRaw").style.display = name === "raw" ? "" : "none";
  $("sub-pretty").classList.toggle("active", name === "pretty");
  $("sub-raw").classList.toggle("active", name === "raw");
}

function setRespStatus(code, ok) {
  const el = $("respStatus");
  el.textContent = code;
  el.className = "resp-status " + (ok ? "ok" : "bad");
}

async function sendTest() {
  const body = currentBody();
  if (!body) { flashReqInfo("请求体不是合法 JSON，无法发送", true); return; }
  const url = getBase() + $("endpoint").value;
  const headers = { "Content-Type": "application/json" };
  const key = $("apiKey").value.trim();
  if (key) headers["Authorization"] = "Bearer " + key;

  $("respPretty").innerHTML = ""; $("respRaw").textContent = "";
  setRespStatus("…", true); $("respTime").textContent = "";
  flashReqInfo("请求中…", false);
  $("sendBtn").disabled = true; $("stopBtn").disabled = false;
  ctrl = new AbortController();
  const t0 = performance.now();

  try {
    const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: ctrl.signal });
    setRespStatus(res.status + " " + res.statusText, res.ok);
    const ctype = res.headers.get("content-type") || "";
    const isStream = ctype.includes("text/event-stream") || (body.stream === true && res.ok);

    if (res.body && isStream) {
      await consumeStream(res, t0);
    } else {
      const text = await res.text();
      $("respRaw").textContent = text;
      let pretty;
      try { pretty = highlightJson(JSON.parse(text)); } catch { pretty = escapeHtml(text); }
      $("respPretty").innerHTML = pretty;
      $("respTime").textContent = (performance.now() - t0).toFixed(0) + " ms";
    }
    flashReqInfo("完成", false);
  } catch (e) {
    if (e.name === "AbortError") { flashReqInfo("已停止", false); }
    else { setRespStatus("请求失败", false); $("respPretty").innerHTML = `<span class="err-text">${escapeHtml(String(e))}\n\n若使用 file:// 打开或跨源访问，请确认网关地址正确、服务在运行。</span>`; flashReqInfo("失败", true); }
  } finally {
    $("sendBtn").disabled = false; $("stopBtn").disabled = true; ctrl = null;
  }
}

async function consumeStream(res, t0) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let raw = "", buf = "", assembled = "";
  showRespTab("pretty");
  const pretty = $("respPretty");
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    const chunk = dec.decode(value, { stream: true });
    raw += chunk; buf += chunk;
    $("respRaw").textContent = raw;
    // Parse complete SSE lines for text deltas.
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (payload === "[DONE]") continue;
      try {
        const obj = JSON.parse(payload);
        assembled += extractDelta(obj);
      } catch { /* partial or non-JSON keepalive */ }
    }
    pretty.textContent = assembled || "(流式响应进行中…)";
    $("respTime").textContent = (performance.now() - t0).toFixed(0) + " ms";
  }
  if (!assembled) pretty.textContent = "(未从事件流中解析到文本；见“原始流”标签)";
}

// Best-effort text extraction across the three protocols' streaming shapes.
function extractDelta(obj) {
  // OpenAI Chat Completions
  if (obj.choices && obj.choices[0]) {
    const c = obj.choices[0];
    if (c.delta && typeof c.delta.content === "string") return c.delta.content;
    if (typeof c.text === "string") return c.text;
  }
  // OpenAI Responses API
  if (typeof obj.delta === "string") return obj.delta;
  if (obj.type && String(obj.type).includes("output_text") && typeof obj.delta === "string") return obj.delta;
  // Anthropic Messages
  if (obj.type === "content_block_delta" && obj.delta && typeof obj.delta.text === "string") return obj.delta.text;
  return "";
}

function abortTest() { if (ctrl) ctrl.abort(); }

/* ------------------------------------------------------------------ *
 * Init
 * ------------------------------------------------------------------ */
(function init() {
  const saved = localStorage.getItem(LS.base);
  $("baseUrl").value = saved || defaultBase();
  $("baseUrl").addEventListener("change", () => {
    localStorage.setItem(LS.base, $("baseUrl").value.trim());
    if (M.es) connect(); // reconnect to the new base
  });
  resetBody();
  renderList();
  connect(); // auto-connect the monitor on load
})();
</script>
