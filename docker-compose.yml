# docker-compose.yml — 运行 raycast2api 网关
#
# 仅通过同目录的 config.json 配置，不提供环境变量配置入口。
# 首次运行前复制 config.example.json 为 config.json 并填写配置；
# host 保持 0.0.0.0、port 保持 8787，与下方容器端口映射一致。
#
# 账号池与请求日志持久化在 ./store/store.db；账号通过 /v1/accounts 接口管理。
#
services:
    raycast2api:
        # 默认拉取 CI 发布到 GHCR 的镜像；固定版本时直接修改标签。
        image: ghcr.io/jwygithub/raycast2api:latest
        # 想用本地源码构建时，注释掉上面的 image，改用：
        # build: .
        container_name: raycast2api
        restart: unless-stopped
        # 以宿主机用户身份运行，绑定挂载的 ./store 等目录才可写（镜像内默认的
        # app 用户 uid 与宿主机不一致时，SQLite 会报 unable to open database file）。
        # 1000:1000 是常见 Linux 桌面/服务器用户；按 `id -u` / `id -g` 调整。
        user: '1000:1000'
        ports:
            - '8787:8787'
        volumes:
            - ./config.json:/app/config.json:ro
            - ./store:/app/store
