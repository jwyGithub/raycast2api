name: Check upstream transport

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "transport/**"
      - "Cargo.*"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/transport-check.yml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "transport/**"
      - "Cargo.*"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/transport-check.yml"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and verify transport and Rust contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: raycast2api:transport-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image startup with Node backend
        shell: bash
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/raycast-transport-config.json"
          cat > "$config_path" <<'JSON'
          {"host":"0.0.0.0","port":8787,"api_key":"ci-key","raycast_signature_secret":"ci-signature","upstream_transport":{"backend":"node"}}
          JSON
          docker run --detach --name raycast-transport-check \
            --publish 127.0.0.1::8787 \
            --mount "type=bind,source=$config_path,target=/app/config.json,readonly" \
            raycast2api:transport-check
          trap 'docker logs raycast-transport-check; docker rm --force raycast-transport-check; rm -f "$config_path"' EXIT
          address="$(docker port raycast-transport-check 8787/tcp)"
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://$address/health"; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
          # With no accounts, /ready must reach account validation after a healthy IPC check.
          curl --silent "http://$address/ready" | jq --exit-status '.message == "No available accounts"'
          docker stop --timeout 15 raycast-transport-check
          test "$(docker inspect --format '{{.State.ExitCode}}' raycast-transport-check)" = 0
